<style>
  :root{
    --deep:#00201B; --dark:#00332A; --brand:#00A76F; --accent:#00E58A;
    --bg:#F5F8F6; --card:#FFFFFF; --ink:#0C2420; --muted:#5C7269; --line:#DCE7E1;
    --evidence:#0FA36B; --limitation:#D8484C; --guideline:#3B6FD4; --practical:#B8860B;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  html{ scrollbar-width:none; -ms-overflow-style:none; }
  html::-webkit-scrollbar{ display:none; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  body::-webkit-scrollbar{ display:none; }
  h1,h2,h3,.display{ font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:-0.01em; }


  .app{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* ============ TOP HEADER ============ */
  /* ============ LANDING PAGE ============ */
  .landing{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(155deg,var(--deep) 0%, var(--dark) 65%, #014a3a 100%);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .landing-inner{ max-width:560px; }
  .landing-badge{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-size:11px; font-weight:700; padding:6px 14px; border-radius:20px; letter-spacing:0.05em; margin-bottom:28px;
  }
  .landing-badge.internal-badge{ display:inline-flex; }
  .landing-title{
    font-family:'Manrope',sans-serif; font-weight:800; font-size:44px; line-height:1.15; color:#fff;
    margin:0 0 16px; letter-spacing:-0.01em;
  }
  .landing-sub{ font-size:15px; color:rgba(255,255,255,0.65); margin:0 0 40px; }
  .landing-enter{
    background:var(--accent); color:var(--deep); border:none; border-radius:12px; padding:14px 32px;
    font-size:15px; font-weight:800; font-family:'Inter',sans-serif; cursor:pointer; display:inline-flex;
    align-items:center; gap:10px; transition:transform 0.15s, box-shadow 0.15s;
  }
  .landing-enter:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,229,138,0.25); }

  /* ============ EXIT BUTTON (returns to landing page) ============ */
  .brand-name-group{ display:flex; align-items:center; gap:10px; }
  .exit-btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff;
    width:28px; height:28px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0; flex:none;
  }
  .exit-btn:hover{ background:rgba(255,255,255,0.18); }
  .exit-btn svg{ width:14px; height:14px; }

  header.top{
    background:linear-gradient(155deg,var(--deep) 0%, var(--dark) 65%, #014a3a 100%);
    color:#fff; padding:14px 20px; flex:none;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .brand-name{ font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; }
  .internal-badge{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-size:10.5px; font-weight:700; padding:5px 11px; border-radius:20px; letter-spacing:0.03em;
    display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  #fullscreenIcon svg{ width:11px; height:11px; }

  /* ============ TAB ROW ============ */
  .tab-row{ display:flex; gap:6px; }
  .tab-btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.75);
    font-size:12px; font-weight:700; padding:8px 16px; border-radius:9px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .tab-btn.active{ background:var(--accent); color:var(--deep); border-color:var(--accent); }

  /* ============ TOPIC PILLS ROW ============ */
  .topic-row{ background:var(--card); border-bottom:1px solid var(--line); padding:10px 20px; flex:none; }
  .topic-pills{ display:flex; gap:8px; flex-wrap:wrap; }
  .topic-pill{
    background:var(--bg); border:1.5px solid var(--line); color:var(--ink); font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:9px; cursor:pointer; max-width:280px; text-align:left; line-height:1.35;
    height:72px; display:flex; align-items:center; overflow:hidden;
  }
  .topic-pill.active{ background:rgba(15,163,107,0.1); border-color:var(--evidence); color:var(--dark); }

  /* ============ TOPIC TITLE (full width, own row) ============ */
  .topic-title-row{ background:var(--card); padding:16px 20px 4px; flex:none; }

  /* ============ BULLET CHIP ROW (full width, BELOW the title) ============ */
  .bullet-row{ background:var(--card); padding:12px 20px 14px; border-bottom:1px solid var(--line); flex:none; }

  /* ============ FOCUSED CONTENT PANE ============ */

  .focus-detail-toggle{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--brand);

  .focus-citations{ margin-top:16px; margin-bottom:24px; padding-top:14px; border-top:1px dashed var(--line); }

  .trial-name{ background:rgba(15,163,107,0.12); color:var(--evidence); font-weight:700; padding:1px 7px; border-radius:5px; }

  /* Chart styles */
  .chart-title{ font-size:11px; font-weight:700; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.03em; }

  .chart-badge .blabel{ font-size:11.5px; font-weight:600; line-height:1.4; }
  .chart-hr{ display:flex; flex-direction:column; gap:12px; }
  .chart-hr-row{ display:flex; align-items:center; gap:10px; }
  .chart-hr-label{ flex:none; width:150px; font-size:11.5px; font-weight:600; color:var(--ink); line-height:1.35; }

  .chart-hr-value{ font-size:10.5px; font-family:'IBM Plex Mono',monospace; color:var(--muted); margin-top:2px; }

  .rd-wrap{ display:flex; flex-direction:column; gap:16px; }
  .rd-panel{ border:1.5px solid var(--line); border-radius:12px; padding:14px 14px 16px; background:#FBFCFB; }

  .rd-connector{ text-align:center; font-size:16px; color:var(--muted); margin:4px 0; line-height:1; }
  .rd-receptor{ background:#FBE5D0; border:1.5px solid #D6923F; color:#7A4E12; font-weight:700; font-size:12px; text-align:center; padding:10px; border-radius:8px; max-width:260px; margin:0 auto; }
  .rd-outcomes-row{ display:flex; gap:10px; margin-top:12px; align-items:flex-start; }
  .rd-outcome-box{ flex:1; background:var(--dark); color:#fff; border-radius:10px; padding:10px 12px; }
  .rd-outcome-title{ font-size:10.5px; font-weight:700; color:var(--accent); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.02em; }
  .rd-outcome-box ul{ margin:0; padding-left:16px; }
  .rd-outcome-box li{ font-size:10.5px; line-height:1.7; color:rgba(255,255,255,0.9); }
  .rd-outcomes-single{ background:var(--dark); color:#fff; border-radius:10px; padding:12px 14px; margin-top:10px; }
  .rd-outcomes-single .rd-cols{ display:flex; gap:14px; }
  .rd-outcomes-single .rd-col{ flex:1; }
  .rd-outcomes-single ul{ margin:0; padding-left:16px; }
  .rd-outcomes-single li{ font-size:10.5px; line-height:1.7; color:rgba(255,255,255,0.9); }

  @media (max-width: 700px){
    .topic-title{ font-size:16px; }
    .focus-headline{ font-size:17px; }
    .chart-hr-label, .chart-compare-label{ width:100px; font-size:10.5px; }
  }
</style>
</head>

<script>
const TOPICS = {

/* ============ SCREENING & DIAGNOSIS ============ */
s1: {
  cat: "screening", title: "HFpEF-ABA Screening Tool — Is It Good Enough, Easy, Practical?",
  bullets: [
    { tag:"evidence", label:"Consistently picks out the right patient, across three separate test groups",
      detail:"If you compared one patient who truly has HFpEF against one who doesn't, the tool correctly identifies which one has HFpEF roughly 8 times out of 10 \u2014 in the original derivation group, and again when tested independently in two other patient groups. That consistency across separate populations is what makes it reliable, not just accurate once. Uses only age, BMI, and AF history \u2014 no imaging required, unlike H2FPEF or HFA-PEFF. (Statistically, this is expressed as AUC: 0.839 derivation, 0.813 international validation, 0.840 unexplained-dyspnea cohort.)",
      chart:{type:"badge", items:[
        {value:"~8 in 10", label:"Derivation group (n=414): correctly tells apart a patient with HFpEF from one without", color:"evidence"},
        {value:"~8 in 10", label:"Independent international group (n=736): same result", color:"evidence"},
        {value:"~8 in 10", label:"Unexplained-dyspnea group (n=228): same result", color:"evidence"}
      ]},
      citation:"Reddy YNV, et al. An evidence-based screening tool for HFpEF: the HFpEF-ABA score. Nat Med. 2024;30(8):2258\u20132264.", url:"https://www.nature.com/articles/s41591-024-03140-1" },
    { tag:"guideline", label:"2026 ACC Expert Consensus positions it as the primary care/EMR screening tool of choice",
      detail:"The pathway states HFpEF-ABA \u2018would function most readily as a screening tool in the primary care setting or in the electronic medical record.\u2019 In cardiology practices where echo data is already available, H2FPEF may be more accurate despite using fewer variables \u2014 a useful distinction when a cardiologist asks why a PCP-facing score matters to them. This is a positioning statement in the consensus pathway, not a formal Class/Level of Evidence rating \u2014 HFpEF-ABA is a screening instrument, not a graded therapy recommendation.",
      chart:{type:"badge", items:[
        {value:"Primary care / EMR", label:"HFpEF-ABA positioned as the tool of choice here", color:"evidence"},
        {value:"Cardiology + echo access", label:"H2FPEF may be preferred here instead", color:"guideline"}
      ]},
      citation:"Management of HFpEF: 2026 ACC Expert Consensus Decision Pathway. JACC. 2026.", url:"https://www.jacc.org/doi/10.1016/j.jacc.2026.06.018" },
    { tag:"limitation", label:"Prognostic value in already-diagnosed HFpEF is modest \u2014 it's a screening tool, not a risk stratifier",
      detail:"In a TOPCAT secondary analysis of already-diagnosed HFpEF patients, higher HFpEF-ABA probability was only modestly associated with HF hospitalization (HR 1.07 per 10% increase, 95% CI 1.00\u20131.14) and showed no significant association with mortality. It performs best as an upstream triage tool \u2014 not for risk-stratifying patients who already carry a confirmed diagnosis.",
      chart:{type:"pathway", title:"What it's for vs. what it isn't", connector:"\u2260",
        items:[
          {title:"\u2713 Screening tool", subtitle:"Used before diagnosis, to flag which patients need echo/NT-proBNP workup", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"},
          {title:"\u2717 Not a risk stratifier", subtitle:"In confirmed HFpEF: HR 1.07 for HF hospitalization, not significant for mortality", bg:"rgba(216,72,76,0.08)", border:"var(--limitation)", color:"var(--limitation)"}
        ]},
      citation:"Prognostic Utility of the HFpEF-ABA Score: Insights From TOPCAT. JACC Adv. 2026.", url:"https://www.jacc.org/doi/10.1016/j.jacadv.2026.102632" },
    { tag:"practical", label:"Practical positioning: pre-echo triage, not a diagnostic determination",
      detail:"Given a probability output, ABA is best positioned as prioritizing which patients need echo/NT-proBNP workup \u2014 not as a stand-alone diagnosis. For cardiologists who already order echo routinely, ABA adds limited incremental value over their existing workup; its real value proposition is upstream, in primary care.",
      chart:{type:"pathway", title:"What it's for vs. what it isn't", connector:"\u2260",
        items:[
          {title:"\u2713 Pre-echo triage tool", subtitle:"Helps prioritize which patients need echo/NT-proBNP workup next", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"},
          {title:"\u2717 Not a diagnostic tool", subtitle:"Doesn't confirm HFpEF or replace echo on its own", bg:"rgba(216,72,76,0.08)", border:"var(--limitation)", color:"var(--limitation)"}
        ]} }
  ]
},

s2: {
  cat: "screening", title: "HFpEF Diagnosis — NT-proBNP Utilization by Cardiologists & GPs",
  bullets: [
    { tag:"guideline", label:"Diagnostic threshold varies meaningfully by region",
      detail:"ESC and AHA recommend a 125 pg/mL threshold for a positive outpatient test. UK NICE recommends 400 pg/mL instead \u2014 the applicable threshold depends on which guideline body governs the market where the HCP practices.",
      chart:{type:"compare", title:"NT-proBNP positive threshold by guideline body", unit:"pg/mL", max:450,
        rows:[{label:"ESC / AHA", value:125},{label:"UK NICE", value:400}]},
      citation:"NT-proBNP testing for HF diagnosis in people with AF: diagnostic accuracy study. 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12574882/" },
    { tag:"limitation", label:"Atrial fibrillation confounds interpretation \u2014 the same population flagged by HFpEF-ABA",
      detail:"In a chronic HF cohort, median NT-proBNP was roughly 2.8x higher in patients with AF than in sinus rhythm, independent of true HF status. Since AF is one of only three HFpEF-ABA inputs, this creates a genuine interpretive tension: AF patients are simultaneously flagged as high pre-test probability by ABA, while their NT-proBNP result is inherently less specific.",
      chart:{type:"compare", title:"Median NT-proBNP by cardiac rhythm (chronic HF)", unit:"pg/mL", max:2800,
        rows:[{label:"Sinus rhythm", value:899}, {label:"Atrial fibrillation", value:2528}]},
      citations:[
        {citation:"Heart failure diagnosis: impacts of atrial fibrillation on NT-proBNP. PLOS Medicine. 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12578210/"},
        {citation:"Corell P, et al. Effect of atrial fibrillation on plasma NT-proBNP in chronic heart failure. Int J Cardiol. 2007;117(3):395\u2013402.", url:"https://pubmed.ncbi.nlm.nih.gov/16919342/"}
      ] },
    { tag:"limitation", label:"Obesity suppresses NT-proBNP, risking false-negative rule-out",
      detail:"Elevated BMI is a recognized cause of falsely low NT-proBNP \u2014 meaning standard thresholds may under-detect HFpEF in obese patients, a population that overlaps substantially with the broader cardio-renal-metabolic HFpEF phenotype. A large prospective multi-site emergency department study (PRECISE-HF) found the standard rule-out threshold misses cases in patients with BMI \u226530 kg/m\u00b2, and found sensitivity and negative predictive value improved using a lower, obesity-adjusted threshold instead.",
      chart:{type:"compare", title:"NT-proBNP rule-out threshold, standard vs. obesity-adjusted", unit:"ng/L", max:320,
        rows:[{label:"Standard threshold", value:300}, {label:"BMI \u226530 kg/m\u00b2 (adjusted)", value:150}]},
      citation:"Optimizing NT-proBNP diagnostic performance in the patient with obesity. Eur Heart J. 2025 (PRECISE-HF).", url:"https://academic.oup.com/eurheartj/article/46/Supplement_1/ehaf784.1147/8308563" },
    { tag:"practical", label:"Real-world access and pathway gaps remain common even where testing exists",
      detail:"A multi-country HFA survey found 40% of respondent clinicians lacked a formal diagnostic referral pathway for elevated natriuretic peptides in their area, and roughly one-third lacked access to NP testing in the community setting at all \u2014 an access problem, not just an interpretation problem.",
      chart:{type:"badge", items:[{value:"40%", label:"lack a formal referral pathway", color:"limitation"},{value:"~33%", label:"lack community NP testing access", color:"limitation"}]},
      citation:"Awareness, access, and adoption of natriuretic peptides for diagnosis of heart failure. ESC HFA survey, PMC. 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11770566/" }
  ]
},

s3: {
  cat: "screening", title: "Referral Pathway Post-ABA Screening — Gaps, Resources, Challenges",
  bullets: [
    { tag:"limitation", label:"No dedicated referral pathway in roughly 40% of surveyed regions",
      detail:"Even where screening successfully flags a high-probability patient, the absence of a structured community-to-specialist pathway is a documented, common bottleneck \u2014 not a hypothetical concern. This is the same HFA survey data relevant to the NT-proBNP access discussion.",
      chart:{type:"badge", items:[
        {value:"40%", label:"of clinicians surveyed have no formal community-to-specialist referral pathway", color:"limitation"},
        {value:"~33%", label:"lack access to NP testing in the community setting at all", color:"limitation"}
      ]},
      citation:"Awareness, access, and adoption of natriuretic peptides for diagnosis of heart failure. ESC HFA survey, PMC. 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11770566/" },
    { tag:"practical", label:"HFA has published dedicated algorithms bridging community and specialist care",
      detail:"The Heart Failure Association has issued dedicated diagnostic pathway algorithms for both emergency department and community settings, specifically intended to standardize the handoff from primary-care flagging to specialist confirmation.",
      chart:{type:"pathway", title:"HFA community-to-specialist pathway", connector:"\u2192",
        items:[
          {title:"Community setting", subtitle:"Symptoms prompt NT-proBNP testing", bg:"rgba(59,111,212,0.08)", border:"var(--guideline)", color:"var(--guideline)"},
          {title:"Elevated result", subtitle:"Refer to secondary-care HF diagnostic service", bg:"rgba(184,134,11,0.08)", border:"var(--practical)", color:"var(--practical)"},
          {title:"Specialist confirmation", subtitle:"Echocardiography + cardiology review", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"}
        ]},
      citation:"HFA consensus diagnostic pathway algorithms, referenced in NP awareness/access survey, PMC 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11770566/" },
    { tag:"guideline", label:"2026 ACC pathway frames a positive ABA result as triggering options, not a mandate",
      detail:"The consensus pathway states HFpEF-ABA probability should prompt \u2018further imaging, natriuretic peptide testing, cardiology referral, or all of these\u2019 \u2014 giving PCPs a menu of next steps rather than mandating immediate specialist referral for every flagged patient, which may ease bottleneck concerns where implemented well.",
      chart:{type:"badge", items:[
        {value:"Further imaging", label:"Any one, or a combination \u2014 not a fixed sequence", color:"guideline"},
        {value:"NT-proBNP testing", label:"Any one, or a combination \u2014 not a fixed sequence", color:"guideline"},
        {value:"Cardiology referral", label:"Any one, or a combination \u2014 not a fixed sequence", color:"guideline"}
      ]},
      citation:"Management of HFpEF: 2026 ACC Expert Consensus Decision Pathway. JACC. 2026.", url:"https://www.jacc.org/doi/10.1016/j.jacc.2026.06.018" },
    { tag:"practical", label:"Referral should be risk-stratified, not universal",
      detail:"Given documented pathway gaps, HFpEF-ABA supports risk-stratified referral \u2014 prioritizing the highest-probability patients for specialist workup \u2014 rather than an expectation that every flagged patient is referred immediately. This approach remains practical in settings with limited or variable specialist access, where referring every flagged patient is not feasible.",
      chart:{type:"pathway", title:"A practical approach to limited specialist capacity", connector:"\u2192",
        items:[
          {title:"Highest-probability patients", subtitle:"Prioritized for specialist referral", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"},
          {title:"Lower-probability patients", subtitle:"Monitor and reassess, rather than immediate referral", bg:"rgba(184,134,11,0.08)", border:"var(--practical)", color:"var(--practical)"}
        ]} }
  ]
},

/* ============ TREATMENT ============ */
t1: {
  cat: "treatment", title: "SGLT2 Inhibitors — Standard of Care in All HFpEF?",
  bullets: [
    { tag:"guideline", label:"Class I, Level A \u2014 reconfirmed as foundational therapy in the 2026 ESC Guidelines",
      detail:"The 2026 ESC Guidelines recommend an SGLT2i (dapagliflozin or empagliflozin) for symptomatic HF independent of LVEF, Class I, Level A \u2014 reconfirming the position established in the 2023 Focused Update. Under the new 2026 framework, GDMT is now an umbrella term split into Foundational Medical Therapy (FMT) and Additional Medical Therapy (AMT); for HFpEF, FMT consists of SGLT2i and MRA together \u2014 both now Class I, Level A (MRA was upgraded from Class IIb, Level C; see the MRA topic for details).",
      chart:{type:"badge", items:[{value:"I / A", label:"SGLT2i \u2014 foundational therapy, all LVEF (2026 ESC)", color:"evidence"}]},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"evidence", label:"Benefit is now shown to be uniform across the entire LVEF spectrum, including \u226560%",
      detail:"A 2026 prespecified pooled analysis of EMPEROR-Preserved and DELIVER (n=12,251) found a 20% risk reduction overall (HR 0.80, 95% CI 0.73\u20130.87), consistent across LVEF <50% (HR 0.76), 50\u201359% (HR 0.79), and \u226560% (HR 0.82) \u2014 interaction P=0.690, meaning no statistically meaningful heterogeneity. This directly resolves earlier uncertainty about whether benefit fades at higher EF.",
      chart:{type:"hr", title:"Primary endpoint HR by LVEF subgroup (95% CI)", rows:[
        {label:"LVEF <50%", hr:0.76, lo:0.65, hi:0.89},
        {label:"LVEF 50\u201359%", hr:0.79, lo:0.68, hi:0.92},
        {label:"LVEF \u226560%", hr:0.82, lo:0.71, hi:0.96}
      ]},
      citation:"Uniform efficacy of SGLT2 inhibitors across the ejection fraction spectrum: prespecified pooled analysis. 2026.", url:"https://pubmed.ncbi.nlm.nih.gov/41908059/" },
    { tag:"evidence", label:"EMPEROR-Preserved: 21% relative risk reduction in the primary composite endpoint",
      detail:"Empagliflozin reduced the composite of cardiovascular death or HF hospitalization by 21% relative risk versus placebo, consistent across prespecified subgroups including diabetes status. The benefit separated early and was sustained: statistically significant by day 18 (HR 0.41, 95% CI 0.17\u20130.99), maintained for the rest of the trial's ~26-month median follow-up.",
      chart:[
        {type:"hr", title:"EMPEROR-Preserved primary results (HR, 95% CI)", rows:[
          {label:"Primary composite<br>(CV death or HHF)", hr:0.79, lo:0.69, hi:0.90},
          {label:"HF hospitalization<br>(component)", hr:0.73, lo:0.61, hi:0.88}
        ]},
        {type:"badge", items:[
          {value:"NNT \u2248 30", label:"Primary composite \u2014 patients treated ~26 months to prevent one event", color:"evidence"},
          {value:"NNT \u2248 31", label:"HF hospitalization alone \u2014 patients treated ~26 months to prevent one event", color:"evidence"}
        ]}
      ],
      citation:"Anker SD, et al. Empagliflozin in Heart Failure with a Preserved Ejection Fraction. N Engl J Med. 2021;385:1451\u20131461.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2107038" },
    { tag:"limitation", label:"No significant reduction in cardiovascular mortality alone",
      detail:"EMPEROR-Preserved found a numerical but not statistically significant reduction in cardiovascular death alone (HR 0.91, 95% CI 0.76\u20131.09). This is a trial-design issue, not necessarily an absence of effect: the trial was powered to detect a difference in the primary composite endpoint (CV death or HF hospitalization), not to independently confirm significance for the CV-death component by itself \u2014 the same pattern seen in dapagliflozin's parallel DELIVER trial. Separately, in patients with type 2 diabetes and established cardiovascular disease, empagliflozin reduced CV death by 38% in EMPA-REG OUTCOME (HR 0.62, 95% CI 0.49\u20130.77) \u2014 a different trial and a different population, not a resolution of the HFpEF-specific finding above. Even within EMPA-REG, the small subgroup with a predicted-HFpEF-like phenotype did not reach significance for this outcome (HR 0.60, 95% CI 0.31\u20131.17), so this mortality signal should not be presented as HFpEF-specific.",
      chart:{type:"hr", title:"CV death: HFpEF trial vs. a different population (HR, 95% CI)", rows:[
        {label:"EMPEROR-Preserved<br>(HFpEF)", hr:0.91, lo:0.76, hi:1.09},
        {label:"EMPA-REG OUTCOME<br>(T2DM + established CVD)", hr:0.62, lo:0.49, hi:0.77},
        {label:"EMPA-REG, predicted-<br>HFpEF-like subgroup", hr:0.60, lo:0.31, hi:1.17}
      ]},
      citations:[
        {citation:"Anker SD, et al. Empagliflozin in Heart Failure with a Preserved Ejection Fraction. N Engl J Med. 2021;385:1451\u20131461.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2107038"},
        {citation:"Zinman B, Wanner C, Lachin JM, et al. Empagliflozin, Cardiovascular Outcomes, and Mortality in Type 2 Diabetes (EMPA-REG OUTCOME). N Engl J Med. 2015;373:2117\u20132128.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa1504720"},
        {citation:"Empagliflozin in Heart Failure With Predicted Preserved Versus Reduced Ejection Fraction: Data From the EMPA-REG OUTCOME Trial. J Card Fail. 2021.", url:"https://onlinejcf.com/article/S1071-9164(21)00202-5/fulltext"}
      ] },
    { tag:"guideline", label:"2026 ESC Guidelines expand SGLT2i's role further \u2014 now including in-hospital initiation during decompensated HF",
      detail:"MRA's HFpEF upgrade to Class I/A came from a retrospective pooled meta-analysis of existing trials (TOPCAT + FINEARTS-HF), not a new prospective trial. SGLT2i, by contrast, picked up a genuinely new, dedicated recommendation in this same 2026 update: in-hospital initiation of an SGLT2i after initial stabilization in decompensated HF is now Class I, Level B1. MRA has no equivalent new decompensated-HF-specific recommendation in this update.",
      chart:[
        {type:"badge", items:[{value:"I / B1", label:"New in 2026: in-hospital SGLT2i initiation after stabilization in decompensated HF", color:"evidence"}]},
        {type:"hr", title:"EMPULSE primary outcome (win ratio, 95% CI)", statLabel:"Win ratio", rows:[{label:"Clinical benefit<br>(hierarchical composite)", hr:1.36, lo:1.09, hi:1.68}]}
      ],
      afterChart:"This is underpinned by <span class=\"trial-name\">EMPULSE</span> (n=530): empagliflozin started a median of 3 days after admission, once stable, produced a statistically significant clinical benefit vs. placebo (win ratio 1.36, 95% CI 1.09\u20131.68, P=0.0054), with no evidence of treatment interaction across tested subgroups \u2014 consistent whether patients had HFrEF or HFpEF, and whether HF was de novo or decompensated chronic.",
      citations:[
        {citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302"},
        {citation:"Voors AA, Angermann CE, Teerlink JR, et al. The SGLT2 inhibitor empagliflozin in patients hospitalized for acute heart failure (EMPULSE): a multinational randomized trial. Nat Med. 2022;28(3):568\u2013574.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC8938265"}
      ] },
    { tag:"limitation", label:"Real-world uptake still lags guideline recommendation, especially in non-diabetic patients",
      detail:"Despite Class I/A status, SGLT2i prescribing has lagged. In a real-world HF registry, only 57.9% of patients overall received an SGLT2i \u2014 a clear gap against a Class I/A recommendation. Diabetes mellitus was among the strongest independent predictors of use (adjusted OR 2.29, 95% CI 1.60\u20133.29), meaning non-diabetic patients were correspondingly less likely to be treated, even though benefit is independent of diabetes status. Cost, administrative/reimbursement hurdles, and historical framing as a \u2018diabetes drug\u2019 are cited contributing factors. This diabetes-status gap is not uniform across every cohort studied; some series (particularly in older adults) have found no significant difference by diabetes status, so its size should be expected to vary by setting.",
      chart:{type:"badge", items:[{value:"57.9%", label:"of eligible HF patients received an SGLT2i in a real-world registry, despite Class I/A guideline status", color:"limitation"}]},
      citation:"Utilization Patterns and Barriers to SGLT2i Prescription in Patients with Heart Failure: Real-World Evidence. 2026.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC13542037/" },
    { tag:"practical", label:"Known, manageable safety profile",
      detail:"Genital mycotic infections and volume depletion are common but manageable. Euglycemic DKA, Fournier's gangrene, and lower-limb amputation are rare but serious — a class-level signal. Fixed-dose with no titration, and can be initiated even during HF hospitalization before discharge — operationally the simplest of the GDMT pillars to start.",
      chart:{type:"table", title:"Adverse event profile", columns:["Common (manageable)","Rare but serious (class-level)"],
        rows:[
          {label:"Events", values:["Genital mycotic infections<br>Volume depletion","Euglycemic DKA<br>Fournier's gangrene<br>Lower-limb amputation"]}
        ]} }
  ]
},

t2: {
  cat: "treatment", title: "MRA (Spironolactone) in HFpEF — Why/Why Not, Old vs New Evidence, ESC Guidelines",
  bullets: [
    { tag:"practical", label:"Mechanism of action: blocking aldosterone's cardiac and renal effects",
      detail:"Aldosterone acts beyond its classic renal sodium-retention role \u2014 its receptors are also expressed in cardiomyocytes, vascular smooth muscle, and endothelial cells, where chronic activation drives inflammation, oxidative stress, cardiac fibrosis, and hypertrophy. Spironolactone and eplerenone competitively block this receptor, and in combination with ACE inhibitors/ARBs, achieve near-complete suppression of the renin\u2013angiotensin\u2013aldosterone system. This mechanism underpins their established benefit in HFrEF, shown in the landmark RALES (spironolactone) and EPHESUS/EMPHASIS-HF (eplerenone) trials.",
      chart:{type:"receptor-diagram", title:"Mineralocorticoid receptor: activation vs. blockade",
        panelA:{
          title:"A. Unopposed receptor activation",
          stimuli:["Aldosterone","Excess cortisol, oxidative stress, glucose"],
          receptor:"Mineralocorticoid receptor",
          renal:{title:"Renal effects", items:["Na\u207a and H\u2082O resorption","Volume overload","K\u207a and Mg\u00b2\u207a excretion","Glomerular injury"]},
          cv:{title:"Cardiovascular effects", items:["Endothelial dysfunction","Vasoconstriction","Inflammation and oxidative stress","Myocardial hypertrophy","Apoptosis and fibrosis"]}
        },
        panelB:{
          title:"B. MRA blockade",
          blockers:["Spironolactone","Eplerenone"],
          receptor:"Mineralocorticoid receptor",
          outcomeCols:[
            ["\u2193 Inflammation","\u2193 Fibrosis","\u2193 Adverse cardiac remodeling"],
            ["\u2191 Vasodilatation","\u2191 Cardiac output","\u2191 LV systolic/diastolic function"],
            ["\u2191 Natriuresis","\u2193 LV filling pressures","\u2193 Atrial/ventricular arrhythmia"]
          ]
        }},
      citation:"Mineralocorticoid Receptor Antagonists in Heart Failure. Cardiac Failure Review.", url:"https://www.cfrjournal.com/articles/evidence-aldosterone-antagonism-heart-failure?language_content_entity=en" },
    { tag:"evidence", label:"TOPCAT showed real benefit \u2014 but only in part of the trial population",
      detail:"Overall TOPCAT primary result was neutral (HR 0.89, 95% CI 0.77\u20131.04). In the Americas cohort specifically, spironolactone significantly reduced the primary outcome (HR 0.82, P=0.026), cardiovascular mortality (\u221226%), and HF hospitalization (\u221218%). Patients enrolled from Russia/Georgia showed no treatment effect at all.",
      chart:{type:"hr", title:"TOPCAT primary outcome HR (95% CI)", rows:[
        {label:"Overall trial", hr:0.89, lo:0.77, hi:1.04},
        {label:"Americas cohort", hr:0.82, lo:0.69, hi:0.98},
        {label:"Russia/Georgia", hr:1.10, lo:0.79, hi:1.51}
      ]},
      citation:"Pitt B, et al. Spironolactone for HFpEF. N Engl J Med. 2014;370:1383\u20131392. Pfeffer MA, et al. Regional Variation in TOPCAT. Circulation. 2015.", url:"https://www.ahajournals.org/doi/10.1161/circulationaha.114.013255" },
    { tag:"limitation", label:"The Russia/Georgia null result likely reflects trial conduct issues \u2014 but it still muddies the overall evidence base",
      detail:"Post-hoc analysis found many Russia/Georgia patients assigned to spironolactone lacked detectable canrenone (its active metabolite), suggesting non-adherence or misclassification, and this cohort's event rates were implausibly low for genuine HFpEF. This explains \u2014 but doesn't erase \u2014 why TOPCAT's headline result reads neutral rather than positive.",
      chart:{type:"hr", title:"TOPCAT primary outcome by region (HR, 95% CI)", rows:[
        {label:"Americas", hr:0.82, lo:0.69, hi:0.98},
        {label:"Russia / Georgia", hr:1.10, lo:0.79, hi:1.51}
      ]},
      citation:"Detection and Management of Geographic Disparities in TOPCAT. Am Heart J. 2016.", url:"https://pubmed.ncbi.nlm.nih.gov/27747305/" },
    { tag:"evidence", label:"Biomarker-guided benefit: elevated BNP identifies likely responders",
      detail:"In TOPCAT, patients randomized via the elevated-BNP entry route achieved significant benefit from spironolactone (P=0.003, P for interaction between strata = 0.01); those randomized via the prior-hospitalization route saw no effect \u2014 establishing biomarker-based patient selection as an evidence-based clinical strategy for this class.",
      chart:{type:"hr", title:"TOPCAT primary outcome by entry stratum (HR, 95% CI)", rows:[
        {label:"Elevated BNP stratum", hr:0.65, lo:0.49, hi:0.87},
        {label:"Hospitalization stratum", hr:1.01, lo:0.84, hi:1.21}
      ]},
      citation:"Pitt B, Pfeffer MA, Assmann SF, et al. Spironolactone for Heart Failure with Preserved Ejection Fraction. N Engl J Med. 2014;370:1383\u20131392.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa1313731" },
    { tag:"guideline", label:"2026 ESC Guidelines: MRA upgraded to Class I, Level A for HF independent of LVEF",
      detail:"The 2026 ESC Guidelines introduce a new framework: GDMT is now an umbrella term covering Foundational Medical Therapy (FMT) and Additional Medical Therapy (AMT). For HFpEF specifically, FMT now consists of SGLT2i and MRA \u2014 both Class I, Level A. This is a genuine upgrade for MRA from the 2023 update's Class IIb, Level C. The evidence basis differs by phenotype: HFrEF relies on steroidal-MRA-only RCTs, while the HFpEF rating rests specifically on a 2024 individual-patient-level meta-analysis pooling steroidal (TOPCAT) and non-steroidal (FINEARTS-HF) MRA trial data together.",
      chart:{type:"badge", items:[
        {value:"I / A", label:"SGLT2i \u2014 reconfirmed, unchanged", color:"evidence"},
        {value:"I / A", label:"MRA \u2014 upgraded from IIb/C (2023) to I/A (2026)", color:"evidence"}
      ]},
      citations:[
        {citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302"},
        {citation:"Jhund PS, Talebi A, Henderson AD, et al. Mineralocorticoid receptor antagonists in heart failure: an individual patient level meta-analysis. Lancet. 2024;404:1119\u20131131.", url:"https://doi.org/10.1016/S0140-6736(24)01733-1"}
      ] },
    { tag:"limitation", label:"Real-world underuse, largely due to hyperkalemia/renal safety concerns",
      detail:"In the CHAMP-HF registry of outpatients with HFrEF, MRA was the least-prescribed of the guideline-directed therapy classes among eligible patients \u2014 well behind renin-angiotensin system inhibition and beta-blockers. Hyperkalemia and renal function concerns, especially relevant given CKD coexists in nearly half of HF patients, are cited as the leading reasons for under-prescription and early discontinuation. This registry is HFrEF-specific; equivalent HFpEF-focused prescribing-rate data is more limited.",
      chart:[
        {type:"compare", title:"CHAMP-HF: % of eligible patients prescribed (HFrEF registry)", unit:"%", max:100,
          rows:[{label:"RAS inhibition (ACEi/ARB/ARNI)", value:73.4},{label:"Beta-blocker", value:67},{label:"MRA", value:33.4}]},
        {type:"table", title:"Why the caution: real-world hyperkalemia after RALES (Ontario, per 1,000 patients)", columns:["Before RALES (1994)","After RALES (2001)"],
          rows:[
            {label:"Spironolactone prescriptions", values:["34","149"]},
            {label:"Hyperkalemia hospitalization", values:["2.4","11.0"]},
            {label:"Hyperkalemia-associated death", values:["0.3","2.0"]}
          ]}
      ],
      citations:[
        {citation:"Greene SJ, Butler J, Albert NM, et al. Medical Therapy for Heart Failure with Reduced Ejection Fraction: The CHAMP-HF Registry. J Am Coll Cardiol. 2018;72(4):351\u2013366.", url:"https://www.jacc.org/doi/10.1016/j.jacc.2018.04.070"},
        {citation:"Juurlink DN, Mamdani MM, Lee DS, et al. Rates of Hyperkalemia after Publication of the Randomized Aldactone Evaluation Study. N Engl J Med. 2004;351:543\u2013551.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa040135"}
      ] }
  ]
},

t3: {
  cat: "treatment", title: "Finerenone in HFpEF — Strength of Evidence, Limitations & Challenges",
  bullets: [
    { tag:"practical", label:"Mechanism of action: nonsteroidal vs steroidal MR blockade",
      detail:"Finerenone is a nonsteroidal, bulky-structure MR antagonist — distinct from the flat, steroidal structure of spironolactone and eplerenone. This structural difference underlies its higher MR selectivity, shorter half-life, and lower rate of sex-hormone-related side effects (e.g., gynecomastia/breast pain) historically associated with spironolactone.",
      chart:{type:"table", title:"Pharmacodynamic & kinetic comparison", columns:["Spironolactone","Eplerenone","Finerenone"],
        rows:[
          {label:"Structural properties", values:["Flat (steroidal)","Flat (steroidal)","Bulky (non-steroidal)"]},
          {label:"MR affinity", values:["+++","+","+++"]},
          {label:"MR selectivity", values:["+","++","+++"]},
          {label:"Sex-hormone-related side effects", values:["++","(+)","–"]},
          {label:"CNS penetration", values:["+","+","–"]},
          {label:"Plasma half-life", values:[">20 h","4–6 h","2–3 h"]},
          {label:"Effect on BP", values:["+++","++","+"]}
        ]},
      citation:"Kintscher U, Edelmann F. The non-steroidal MRA finerenone and HFpEF. Cardiovasc Diabetol. 2023.", url:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10311906/" },
    { tag:"evidence", label:"FINEARTS-HF: first MRA of either class to show a positive primary outcome in this population",
      detail:"In 6,001 patients with LVEF \u226540% (median follow-up 32 months), finerenone reduced the composite of total worsening HF events plus CV death by 16% (rate ratio 0.84, 95% CI 0.74\u20130.95, P=0.007) \u2014 driven primarily by fewer HF hospitalization/urgent visit events (rate ratio 0.82, P=0.006).",
      chart:{type:"hr", title:"FINEARTS-HF outcomes (rate ratio / HR, 95% CI)", rows:[
        {label:"Primary composite", hr:0.84, lo:0.74, hi:0.95},
        {label:"Worsening HF events", hr:0.82, lo:0.71, hi:0.94},
        {label:"CV death alone", hr:0.93, lo:0.78, hi:1.11}
      ]},
      citation:"Solomon SD, McMurray JJV, et al. Finerenone in HF with Mildly Reduced or Preserved Ejection Fraction. N Engl J Med. 2024;391:1475\u20131485.", url:"https://www.nejm.org/doi/10.1056/NEJMoa2407107" },
    { tag:"evidence", label:"Consistent benefit across age, plus a notable metabolic signal",
      detail:"Benefit was consistent across all age quartiles from 40 to 97 years (P for interaction = 0.27). A secondary finding also showed a 24% relative reduction in new-onset diabetes (HR 0.76, 95% CI 0.59\u20130.97, P=0.026) \u2014 a notable ancillary signal given the metabolic overlap common in HFpEF.",
      chart:{type:"hr", title:"Primary outcome by age quartile (rate ratio, 95% CI)", rows:[
        {label:"Q1: 40\u201366 yrs", hr:0.70, lo:0.53, hi:0.92},
        {label:"Q2: 67\u201373 yrs", hr:0.83, lo:0.64, hi:1.07},
        {label:"Q3: 74\u201379 yrs", hr:0.98, lo:0.76, hi:1.26},
        {label:"Q4: \u226580 yrs", hr:0.85, lo:0.67, hi:1.07}
      ]},
      citation:"Finerenone Improves Outcomes Irrespective of Age: FINEARTS-HF Prespecified Analysis. Circ Heart Fail. 2024.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11573060/" },
    { tag:"limitation", label:"No significant reduction in cardiovascular or all-cause mortality alone",
      detail:"As with SGLT2i, the benefit is driven by reduced HF events/hospitalization rather than a mortality signal.",
      chart:{type:"hr", title:"FINEARTS-HF mortality outcomes (HR, 95% CI)", rows:[
        {label:"CV death<br>(8.1% vs 8.7%)", hr:0.93, lo:0.78, hi:1.11},
        {label:"All-cause mortality<br>(16.4% vs 17.4%)", hr:0.93, lo:0.83, hi:1.06}
      ]},
      citation:"Solomon SD, McMurray JJV, et al. FINEARTS-HF. N Engl J Med. 2024;391:1475\u20131485.", url:"https://www.nejm.org/doi/10.1056/NEJMoa2407107" },
    { tag:"guideline", label:"Now reflected in the 2026 ESC Guidelines \u2014 via a pooled MRA-class recommendation, not a standalone rating",
      detail:"FINEARTS-HF (published October 2024) postdated the 2023 ESC Focused Update, so finerenone initially carried no formal Class/Level rating. The 2026 ESC Guidelines have since incorporated FINEARTS-HF data into a broader MRA-class recommendation: for HFpEF, MRA (steroidal or non-steroidal) is now Class I, Level A, with the Task Force explicit that this specific rating rests on a pooled individual-patient-level meta-analysis of TOPCAT and FINEARTS-HF together \u2014 not a standalone finerenone rating.",
      chart:{type:"badge", items:[{value:"I / A", label:"MRA class (steroidal or non-steroidal) in HFpEF \u2014 via pooled meta-analysis, not a standalone finerenone rating", color:"guideline"}]},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" }
  ]
},

r1: {
  cat: "residual", title: "SGLT2i to Aldosterone Blockade vs Receptor Blockade — Evidence Comparison",
  bullets: [
    { tag:"evidence", label:"SGLT2i is the foundation \u2014 its 20% relative risk reduction still leaves real residual risk for aldosterone/receptor blockade to address",
      detail:"A 2026 prespecified pooled analysis of EMPEROR-Preserved and DELIVER (n=12,251) found empagliflozin/dapagliflozin reduce the composite of CV death or HF hospitalization by 20% (HR 0.80, 95% CI 0.73\u20130.87), consistent across the full LVEF spectrum. That 20% reduction means roughly 80% of the original relative risk remains even in a patient already optimized on an SGLT2i \u2014 real, substantial residual risk. This is precisely where aldosterone/receptor blockade (MRA) adds value: not as a competitor to SGLT2i, but as the next step once SGLT2i is established.",
      chart:{type:"pathway", title:"A practical sequence, not a forced order", connector:"\u2192",
        items:[
          {title:"1. SGLT2i", subtitle:"Foundational \u2014 fixed dose, no titration, start here", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"},
          {title:"2. Assess residual risk", subtitle:"Symptoms, KCCQ trend, biomarkers", bg:"rgba(184,134,11,0.08)", border:"var(--practical)", color:"var(--practical)"},
          {title:"3. Add MRA", subtitle:"Aldosterone/receptor blockade \u2014 now Class I/A in HFpEF", bg:"rgba(59,111,212,0.08)", border:"var(--guideline)", color:"var(--guideline)"}
        ]},
      citation:"Uniform efficacy of SGLT2 inhibitors across the ejection fraction spectrum: prespecified pooled analysis. 2026.", url:"https://pubmed.ncbi.nlm.nih.gov/41908059/" },
    { tag:"guideline", label:"Guideline-class comparison at a glance \u2014 updated for the 2026 ESC Guidelines",
      detail:"Under the 2023 Focused Update, SGLT2i (Class I/A) sat well ahead of MRA (Class IIb/C) in HFpEF. The 2026 ESC Guidelines have closed that gap: MRA (steroidal or non-steroidal) is now also Class I, Level A for HFpEF, based on a pooled individual-patient-level meta-analysis of TOPCAT and FINEARTS-HF. Both drug classes now carry the same formal guideline weight.",
      chart:{type:"badge", items:[
        {value:"I / A", label:"SGLT2i \u2014 unchanged", color:"evidence"},
        {value:"I / A", label:"MRA, steroidal or non-steroidal \u2014 upgraded from IIb/C", color:"evidence"}
      ]},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"evidence", label:"Mechanistically distinct: SGLT2i does not act via the mineralocorticoid pathway",
      detail:"Empagliflozin's cardiorenal benefit operates via natriuresis, improved cardiac energetics, and anti-fibrotic effects — independent of the renin–angiotensin–aldosterone system. SGLT2i and MRA/finerenone act on separate pathways: complementary mechanisms, not competitors.",
      chart:{type:"pathway", title:"Two independent mechanisms", connector:"≠",
        items:[
          {title:"SGLT2i (Empagliflozin)", subtitle:"Renal sodium-glucose cotransport", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"},
          {title:"MRA / Finerenone", subtitle:"Mineralocorticoid receptor", bg:"rgba(59,111,212,0.08)", border:"var(--guideline)", color:"var(--guideline)"}
        ]} },
    { tag:"evidence", label:"Steroidal vs nonsteroidal MR blockade: real pharmacological differences",
      detail:"Spironolactone/eplerenone have off-target activity at androgen and progesterone receptors, driving gynecomastia/breast pain in some patients. Finerenone is structurally distinct — more MR-selective with a shorter half-life, designed to reduce off-target effects while retaining potent anti-fibrotic activity.",
      chart:{type:"table", title:"Steroidal vs nonsteroidal MRA", columns:["Spironolactone/Eplerenone","Finerenone"],
        rows:[
          {label:"MR selectivity", values:["Lower","Higher"]},
          {label:"Off-target receptor activity", values:["Yes (androgen, progesterone)","Minimal"]},
          {label:"Plasma half-life", values:["Longer","Shorter"]},
          {label:"Class-linked side effect", values:["Gynecomastia / breast pain","Not typically observed"]}
        ]},
      citation:"Kintscher U, Edelmann F. The non-steroidal MRA finerenone and HFpEF. Cardiovasc Diabetol. 2023.", url:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10311906/" },
    { tag:"guideline", label:"The updated 2026 ACC pathway goes further than ESC \u2014 explicitly preferring non-steroidal MRA over steroidal",
      detail:"ESC's 2026 Class I/A rating treats the MRA class collectively, without distinguishing steroidal from non-steroidal. The updated 2026 ACC Expert Consensus Pathway takes a more specific practical position: optimal medical therapy for HFpEF should include an SGLT2i plus a non-steroidal MRA (finerenone), citing its stronger evidence base \u2014 with a steroidal MRA positioned as a reasonable alternative specifically when cost or tolerance is prohibitive, not as a co-equal first choice.",
      chart:{type:"badge", items:[
        {value:"Preferred", label:"Non-steroidal MRA (finerenone) \u2014 strongest evidence of benefit", color:"evidence"},
        {value:"Reasonable alternative", label:"Steroidal MRA \u2014 if cost or tolerance is prohibitive", color:"guideline"}
      ]},

<script>
const TAB_TOPICS = {
  screening: ["s1","s2","s3"],
  treatment: ["t1","t2","t3"],
  residual: ["r1","r2","r3","r4"]
};
const TAB_LABELS = {screening:"Screening & Diagnosis", treatment:"Treatment", residual:"Residual Risk & Treatment Escalation"};
const TAG_LABEL = {evidence:"Evidence", limitation:"Limitation", guideline:"Guideline", practical:"Practical"};

let activeTab = "screening";
let activeTopic = "s1";
let activeBulletIdx = 0;

function buildChart(chart){
  if(!chart) return "";
  if(chart.type === "compare"){
    let rows = chart.rows.map(r=>{
      const pct = Math.min(100, (r.value / chart.max) * 100);
      return `<div class="chart-compare-row">
        <div class="chart-compare-label">${r.label}</div>
        <div class="chart-compare-track"><div class="chart-compare-fill" style="width:${pct}%; background:var(--brand);"><span>${r.range || (r.value + (chart.unit==='AUC' ? '' : ' '+chart.unit))}</span></div></div>
      </div>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''}</div><div class="chart-compare">${rows}</div></div>`;
  }
  if(chart.type === "badge"){
    let items = chart.items.map(it=>{
      const colorVar = {evidence:'var(--evidence)', limitation:'var(--limitation)', guideline:'var(--guideline)'}[it.color] || 'var(--muted)';
      const bgVar = it.color==='evidence' ? 'rgba(15,163,107,0.1)' : it.color==='limitation' ? 'rgba(216,72,76,0.1)' : it.color==='guideline' ? 'rgba(59,111,212,0.1)' : 'rgba(92,114,105,0.08)';
      return `<div class="chart-badge" style="background:${bgVar}; border:1.5px solid ${colorVar};">
        <div class="bclass" style="color:${colorVar};">${it.value}</div>
        <div class="blabel" style="color:var(--ink);">${it.label}</div>
      </div>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-badge-row">${items}</div></div>`;
  }
  if(chart.type === "hr"){
    let allVals = [];
    chart.rows.forEach(r=>{ allVals.push(r.lo, r.hi, r.hr); });
    const minV = Math.min(0.5, ...allVals) - 0.05;
    const maxV = Math.max(1.2, ...allVals) + 0.05;
    const scale = v => ((v - minV) / (maxV - minV)) * 100;
    const nullPos = scale(1.0);
    let rows = chart.rows.map(r=>{
      const loPos = scale(r.lo), hiPos = scale(r.hi), ptPos = scale(r.hr);
      return `<div class="chart-hr-row">
        <div class="chart-hr-label">${r.label}</div>
        <div class="chart-hr-line">
          <div class="chart-hr-axis"></div>
          <div class="chart-hr-null" style="left:${nullPos}%;"></div>
          <div class="chart-hr-ci" style="left:${loPos}%; width:${hiPos-loPos}%;"></div>
          <div class="chart-hr-point" style="left:${ptPos}%;"></div>
        </div>
        <div class="chart-hr-value">${chart.statLabel || 'HR'} ${r.hr.toFixed(2)} (${r.lo.toFixed(2)}\u2013${r.hi.toFixed(2)})</div>
      </div>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''} \u00b7 dashed line = no effect (${chart.statLabel || 'HR'} 1.0)</div><div class="chart-hr">${rows}</div></div>`;
  }
  if(chart.type === "pathway"){
    const boxes = chart.items.map(it=>
      `<div style="flex:1; background:${it.bg}; border:1.5px solid ${it.border}; border-radius:12px; padding:14px 12px; text-align:center;">
        <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:13.5px; color:${it.color}; margin-bottom:5px;">${it.title}</div>
        <div style="font-size:11px; color:var(--ink); line-height:1.5;">${it.subtitle}</div>
      </div>`
    ).join(`<div style="display:flex; align-items:center; padding:0 8px; color:var(--muted); font-size:11px; font-weight:700; flex-direction:column; text-align:center;">${chart.connector||'\u2260'}</div>`);
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''}</div><div style="display:flex; align-items:stretch;">${boxes}</div></div>`;
  }
  if(chart.type === "table"){
    const headerCells = chart.columns.map(col=>`<th style="text-align:center; padding:9px 10px; font-size:11px; font-weight:700; color:var(--dark); border-bottom:2px solid var(--line);">${col}</th>`).join("");
    const bodyRows = chart.rows.map(r=>{
      const valCells = r.values.map(v=>`<td style="text-align:center; padding:9px 10px; font-size:11.5px; color:var(--ink); border-bottom:1px solid var(--line);">${v}</td>`).join("");
      return `<tr><td style="padding:9px 10px; font-size:11.5px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--line);">${r.label}</td>${valCells}</tr>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''}</div><table style="width:100%; border-collapse:collapse;"><tr><th style="padding:9px 10px; border-bottom:2px solid var(--line);"></th>${headerCells}</tr>${bodyRows}</table></div>`;
  }
  if(chart.type === "receptor-diagram"){
    const a = chart.panelA, b = chart.panelB;
    const stimuliA = a.stimuli.map(s=>`<div class="rd-stimulus">${s}</div>`).join("");
    const renalItems = a.renal.items.map(i=>`<li>${i}</li>`).join("");
    const cvItems = a.cv.items.map(i=>`<li>${i}</li>`).join("");
    const blockersB = b.blockers.map(s=>`<div class="rd-blocker">${s}</div>`).join("");
    const outcomeCols = b.outcomeCols.map(col=>`<div class="rd-col"><ul>${col.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("");
    return `<div class="bullet-chart">
      <div class="chart-title">${chart.title||''}</div>
      <div class="rd-wrap">
        <div class="rd-panel">
          <div class="rd-panel-title">${a.title}</div>
          <div class="rd-stimuli-row">${stimuliA}</div>
          <div class="rd-connector">\u2193</div>
          <div class="rd-receptor">${a.receptor}</div>
          <div class="rd-outcomes-row">
            <div class="rd-outcome-box"><div class="rd-outcome-title">${a.renal.title}</div><ul>${renalItems}</ul></div>
            <div class="rd-outcome-box"><div class="rd-outcome-title">${a.cv.title}</div><ul>${cvItems}</ul></div>
          </div>
        </div>
        <div class="rd-panel">
          <div class="rd-panel-title">${b.title}</div>
          <div class="rd-stimuli-row">${blockersB}</div>
          <div class="rd-connector">\u22a3</div>
          <div class="rd-receptor">${b.receptor}</div>
          <div class="rd-connector">\u2193</div>
          <div class="rd-outcomes-single"><div class="rd-cols">${outcomeCols}</div></div>
        </div>
      </div>
    </div>`;
  }
  return "";
}

function renderTabs(){
  document.getElementById('tabRow').innerHTML = Object.keys(TAB_TOPICS).map(tab=>
    `<button class="tab-btn ${tab===activeTab?'active':''}" onclick="selectTab('${tab}')">${TAB_LABELS[tab]}</button>`
  ).join('');
}

function renderTopicPills(){
  document.getElementById('topicPills').innerHTML = TAB_TOPICS[activeTab].map(tid=>
    `<button class="topic-pill ${tid===activeTopic?'active':''}" onclick="selectTopic('${tid}')">${TOPICS[tid].title}</button>`
  ).join('');
}

function renderBulletChips(){
  const t = TOPICS[activeTopic];
  document.getElementById('bulletChips').innerHTML = t.bullets.map((b,i)=>
    `<div class="bullet-chip ${i===activeBulletIdx?'active':''}" onclick="selectBullet(${i})">
      <span class="bchip-dot ${b.tag}"></span>
      <span class="bchip-text">${b.label}</span>
    </div>`
  ).join('');
  document.getElementById('bulletChips').scrollLeft = 0;
}

function renderFocus(){
  const t = TOPICS[activeTopic];
  const b = t.bullets[activeBulletIdx];
  const charts = Array.isArray(b.chart) ? b.chart.map(buildChart).join('') : buildChart(b.chart);

  let citations = [];
  if(Array.isArray(b.citations)) citations = b.citations;
  else if(b.citation) citations = [{citation:b.citation, url:b.url}];
  const citeHtml = citations.map(c=>`<div class="focus-cite-line"><span>&#128218;</span><span>${c.url ? `<a href="${c.url}" target="_blank" rel="noopener">${c.citation}</a>` : c.citation}</span></div>`).join('');

  document.getElementById('focusInner').innerHTML = `
    <div class="focus-tagpill ${b.tag}">${TAG_LABEL[b.tag]}</div>
    <div class="focus-headline">${b.label}</div>
    <div class="focus-chart-wrap">${charts}</div>
    ${b.afterChart ? `<div class="focus-detail open"><div class="focus-detail-inner">${b.afterChart}</div></div>` : ''}
    <div class="focus-detail-toggle" onclick="toggleDetail()">
      <span id="toggleIcon">&#9656;</span> <span id="toggleLabel">Show full clinical detail</span>
    </div>
    <div class="focus-detail" id="detailBox"><div class="focus-detail-inner">${b.detail}</div></div>
    ${citeHtml ? `<div class="focus-citations">${citeHtml}</div>` : ''}
  `;

  document.getElementById('slideCounter').textContent = `${activeBulletIdx+1} / ${t.bullets.length}`;
  document.getElementById('prevBtn').disabled = activeBulletIdx === 0;
  document.getElementById('nextBtn').disabled = activeBulletIdx === t.bullets.length - 1;
  document.getElementById('topicEyebrow').textContent = TAB_LABELS[t.cat];
  document.getElementById('topicTitle').textContent = t.title;
}

function toggleDetail(){
  const box = document.getElementById('detailBox');
  const icon = document.getElementById('toggleIcon');
  const label = document.getElementById('toggleLabel');
  const isOpen = box.classList.toggle('open');
  icon.innerHTML = isOpen ? '&#9662;' : '&#9656;';
  label.textContent = isOpen ? 'Hide clinical detail' : 'Show full clinical detail';
}

function selectTab(tab){
  activeTab = tab;
  activeTopic = TAB_TOPICS[tab][0];
  activeBulletIdx = 0;
  renderAll();
}
function selectTopic(tid){
  activeTopic = tid;
  activeBulletIdx = 0;
  renderAll();
}
function selectBullet(i){
  activeBulletIdx = i;
  renderBulletChips();
  renderFocus();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBullet(delta){
  const t = TOPICS[activeTopic];
  const next = activeBulletIdx + delta;
  if(next >= 0 && next < t.bullets.length) selectBullet(next);
}

function renderAll(){
  renderTabs();
  renderTopicPills();
  renderBulletChips();
  renderFocus();
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goBullet(1);
  if(e.key === 'ArrowLeft') goBullet(-1);
});

/* Swipe / drag navigation on the focused content area - works for touch (iPad) and mouse (click-drag) */
(function(){
  const zone = document.getElementById('focusContent') || document.querySelector('.focus-content');
  if(!zone) return;
  let startX = null, startY = null, dragging = false;
  const THRESHOLD = 50; // minimum horizontal distance in px to count as a swipe

  zone.addEventListener('pointerdown', (e)=>{
    startX = e.clientX; startY = e.clientY; dragging = true;
  });
  zone.addEventListener('pointerup', (e)=>{
    if(!dragging || startX === null) return;
    dragging = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // require a mostly-horizontal gesture so vertical scrolling isn't hijacked
    if(Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) goBullet(1);   // swiped left -> next
      else goBullet(-1);        // swiped right -> prev
    }
    startX = null; startY = null;
  });
  zone.addEventListener('pointercancel', ()=>{ dragging = false; startX = null; });
})();

/* Fullscreen button */
const ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
const ICON_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>';
function updateFullscreenIcon(){
  const isFs = !!document.fullscreenElement;
  ['fullscreenIcon','fullscreenIconLanding'].forEach(id=>{
    const icon = document.getElementById(id);
    if(icon) icon.innerHTML = isFs ? ICON_COLLAPSE : ICON_EXPAND;
  });
}
if(document.fullscreenEnabled){
  ['fullscreenBtn','fullscreenBtnLanding'].forEach(id=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });
  });
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
}
updateFullscreenIcon();

/* Landing page <-> main app toggle */
document.getElementById('enterBtn').addEventListener('click', ()=>{
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
});
document.getElementById('exitBtn').addEventListener('click', ()=>{
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('landingPage').style.display = 'flex';
});

renderAll();
</script>
