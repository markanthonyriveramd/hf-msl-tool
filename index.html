function initCalculator(){
  const $ = id => document.getElementById(id);
  const ageEl = $('calc-age'), htEl = $('calc-ht'), wtEl = $('calc-wt');
  const afSegEl = $('calc-afSeg');
  if(!ageEl) return;

  function segVal(){
    const btn = afSegEl.querySelector('button.on');
    return btn ? btn.dataset.v : null;
  }
  function setGauge(fraction, color){
    const circumference = 283;
    const offset = circumference - (circumference*Math.max(0,Math.min(1,fraction)));
    $('calc-arc').setAttribute('stroke-dashoffset', offset);
    $('calc-arc').setAttribute('stroke', color);
  }
  function updateBmiOnly(){
    const htStr = htEl.value, wtStr = wtEl.value;
    const ht = parseFloat(htStr), wt = parseFloat(wtStr);
    const bmi = (htStr!=='' && wtStr!=='') ? wt/((ht/100)*(ht/100)) : NaN;
    $('calc-bmiOut').textContent = !isNaN(bmi) ? bmi.toFixed(1)+' kg/m\u00B2' : '\u2014';
  }
  function resetResult(){
    $('calc-scoreNum').textContent = '\u2014';
    $('calc-cat').textContent = '\u2014';
    $('calc-cat').className = 'calc-gauge-cat calc-cat-neutral';
    $('calc-actionBox').innerHTML = 'Enter all patient values, then press Calculate.';
    $('calc-ntprobnpBox').classList.remove('show');
    setGauge(0, 'rgba(255,255,255,0.18)');
  }
  function calc(){
    const ageStr = ageEl.value, htStr = htEl.value, wtStr = wtEl.value;
    const afSel = segVal();
    const ht = parseFloat(htStr), wt = parseFloat(wtStr);
    const bmi = (htStr!=='' && wtStr!=='') ? wt/((ht/100)*(ht/100)) : NaN;
    updateBmiOnly();

    const complete = ageStr!=='' && htStr!=='' && wtStr!=='' && afSel!==null;
    if(!complete){
      resetResult();
      $('calc-actionBox').innerHTML = 'Please enter age, height, weight, and AF history before calculating.';
      return;
    }
    const age = parseFloat(ageStr);
    const af = parseInt(afSel);
    const y = -7.78875077116607 + 0.0625642747159337*age + 0.135149246234458*bmi + 2.04080564803471*af;
    const z = Math.exp(y);
    const prob = (z/(1+z))*100;
    $('calc-scoreNum').innerHTML = prob.toFixed(1)+'<span style="font-size:14px;">%</span>';

    let catClass, catText, actionHtml, color;
    if(prob<20){
      catClass='calc-cat-low'; catText='Low probability'; color='#0FA36B';
      actionHtml = '<b>Low probability</b>HFpEF is unlikely based on this screen. Consider alternative explanations for the symptoms. Reassess if symptoms progress.';
      $('calc-ntprobnpBox').classList.remove('show');
    } else if(prob<=70){
      catClass='calc-cat-interm'; catText='Intermediate probability'; color='#E1A027';
      actionHtml = '<b>Intermediate probability</b>Recommended next step: order NT-proBNP to guide the referral decision.';
      $('calc-ntprobnpBox').classList.add('show');
    } else {
      catClass='calc-cat-high'; catText='High probability'; color='#D8484C';
      actionHtml = '<b>High probability</b>Recommended next step: refer to cardiology for further evaluation.';
      $('calc-ntprobnpBox').classList.remove('show');
    }
    $('calc-cat').textContent = catText;
    $('calc-cat').className = 'calc-gauge-cat '+catClass;
    $('calc-actionBox').innerHTML = actionHtml;
    setGauge(prob/100, color);
  }
  function resetAll(){
    ageEl.value = ''; htEl.value = ''; wtEl.value = '';
    afSegEl.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
    const ntEl = $('calc-ntprobnp');
    ntEl.value = '';
    $('calc-ntprobnpResult').classList.remove('show');
    $('calc-bmiOut').textContent = '\u2014';
    resetResult();
    $('calc-actionBox').innerHTML = 'Enter all patient values, then press Calculate.';
  }

  function bindCalcEvents(){
    htEl.addEventListener('input', updateBmiOnly);
    wtEl.addEventListener('input', updateBmiOnly);
    afSegEl.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        afSegEl.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
        btn.classList.add('on');
      });
    });
    $('calc-calculateBtn').addEventListener('click', calc);
    $('calc-resetBtn').addEventListener('click', resetAll);
    const ntEl = $('calc-ntprobnp');
    ntEl.addEventListener('input', function(){
      const val = parseFloat(this.value);
      const box = $('calc-ntprobnpResult');
      if(this.value===''){ box.classList.remove('show'); return; }
      box.classList.add('show');
      box.textContent = val < 125
        ? 'NT-proBNP below threshold: HFpEF unlikely. Continue monitoring; reassess if symptoms change.'
        : 'NT-proBNP at or above threshold: refer to cardiologist for further evaluation (echocardiography recommended).';
    });
  }

  bindCalcEvents();
}

function renderFocus(){
  const t = TOPICS[activeTopic];
  const b = t.bullets[activeBulletIdx];
  const charts = Array.isArray(b.chart) ? b.chart.map(buildChart).join('') : buildChart(b.chart);

  let citations = [];
  if(Array.isArray(b.citations)) citations = b.citations;
  else if(b.citation) citations = [{citation:b.citation, url:b.url}];
  const citeHtml = citations.map(c=>`<div class="focus-cite-line"><span>&#128218;</span><span>${c.url ? `<a href="${c.url}" target="_blank" rel="noopener">${c.citation}</a>` : c.citation}</span></div>`).join('');

  document.getElementById('focusInner').innerHTML = `
    <div class="focus-tagpill ${b.tag}">${TAG_LABEL[b.tag]}</div>
    <div class="focus-headline">${b.label}</div>
    <div class="focus-chart-wrap">${charts}</div>
    ${b.afterChart ? `<div class="focus-detail open"><div class="focus-detail-inner">${b.afterChart}</div></div>` : ''}
    <div class="focus-detail-toggle" onclick="toggleDetail()">
      <span id="toggleIcon">&#9656;</span> <span id="toggleLabel">Show full clinical detail</span>
    </div>
    <div class="focus-detail" id="detailBox"><div class="focus-detail-inner">${b.detail}</div></div>
    ${citeHtml ? `<div class="focus-citations">${citeHtml}</div>` : ''}
  `;

  const chartTypes = Array.isArray(b.chart) ? b.chart.map(c=>c && c.type) : [b.chart && b.chart.type];
  if(chartTypes.includes("calculator")) initCalculator();
  if(chartTypes.includes("hf-dx-algorithm")) centerDxFlowScroll();

  document.getElementById('slideCounter').textContent = `${activeBulletIdx+1} / ${t.bullets.length}`;

  document.getElementById('nextBtn').disabled = activeBulletIdx === t.bullets.length - 1;

  renderAll(true, true);

function collectAllReferences(){
  const seen = new Map();
  Object.values(TOPICS).forEach(topic=>{
    topic.bullets.forEach(b=>{
      let cites = [];
      if(Array.isArray(b.citations)) cites = b.citations;
      else if(b.citation) cites = [{citation:b.citation, url:b.url}];
      cites.forEach(c=>{
        const key = c.url || c.citation;
        if(!seen.has(key)) seen.set(key, c);
      });
    });
  });
  return [...seen.values()].sort((a,b)=>a.citation.localeCompare(b.citation));
}

function renderReferences(){
  const refs = collectAllReferences();
  const items = refs.map((r,i)=>
    `<div class="ref-item">
      <span class="ref-num">${i+1}.</span>
      <span>${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">${r.citation}</a>` : `<span class="ref-plain">${r.citation}</span>`}</span>
    </div>`
  ).join('');
  document.getElementById('referencesView').innerHTML = `
    <div class="ref-header">
      <div class="ref-eyebrow">All Sources</div>
      <div class="ref-title">References</div>
      <div class="ref-count">${refs.length} sources cited throughout this guide, alphabetized by first author</div>
    </div>
    <div class="ref-list">${items}</div>
  `;
}

function selectBullet(i){

function goBullet(delta){
  const t = TOPICS[activeTopic];
  const next = activeBulletIdx + delta;
  if(next >= 0 && next < t.bullets.length) selectBullet(next);
}

function renderAll(resetPillsScroll, resetChipsScroll){
  renderTabs();
  renderTopicPills(resetPillsScroll);
  renderBulletChips(resetChipsScroll);
  renderFocus();
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') goBullet(1);

});

/* Swipe / drag navigation on the focused content area - works for touch (iPad) and mouse (click-drag) */
(function(){
  const zone = document.getElementById('focusContent') || document.querySelector('.focus-content');
  if(!zone) return;
  let startX = null, startY = null, dragging = false;
  const THRESHOLD = 50; // minimum horizontal distance in px to count as a swipe

  zone.addEventListener('pointerdown', (e)=>{
    startX = e.clientX; startY = e.clientY; dragging = true;
  });
  zone.addEventListener('pointerup', (e)=>{
    if(!dragging || startX === null) return;
    dragging = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // require a mostly-horizontal gesture so vertical scrolling isn't hijacked
    if(Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) goBullet(1);   // swiped left -> next
      else goBullet(-1);        // swiped right -> prev
    }
    startX = null; startY = null;
  });
  zone.addEventListener('pointercancel', ()=>{ dragging = false; startX = null; });
})();

/* Contain vertical touch drags at the scroll boundary so they don't leak out to the
   page/OS and get misread as a swipe-to-exit-fullscreen gesture on iPad. Only
   intervenes exactly at the top/bottom edge; normal scrolling is untouched. */
(function(){
  const scrollZone = document.querySelector('.focus-content');
  if(!scrollZone) return;
  let touchStartY = null;

  scrollZone.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});

  scrollZone.addEventListener('touchmove', (e)=>{
    if(e.touches.length !== 1 || touchStartY === null) return;
    const deltaY = e.touches[0].clientY - touchStartY; // positive = finger moving down
    const atTop = scrollZone.scrollTop <= 0;
    const atBottom = scrollZone.scrollTop + scrollZone.clientHeight >= scrollZone.scrollHeight - 1;
    if((deltaY > 0 && atTop) || (deltaY < 0 && atBottom)){
      e.preventDefault();
    }
  }, {passive:false});

  scrollZone.addEventListener('touchend', ()=>{ touchStartY = null; });
  scrollZone.addEventListener('touchcancel', ()=>{ touchStartY = null; });
})();

/* Fullscreen button */
const ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
const ICON_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>';
function updateFullscreenIcon(){
  const isFs = !!document.fullscreenElement;
  ['fullscreenIcon','fullscreenIconLanding'].forEach(id=>{
    const icon = document.getElementById(id);
    if(icon) icon.innerHTML = isFs ? ICON_COLLAPSE : ICON_EXPAND;
  });
  document.body.classList.toggle('fullscreen-active', isFs);
}
if(document.fullscreenEnabled){
  ['fullscreenBtn','fullscreenBtnLanding'].forEach(id=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });
  });
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
}
updateFullscreenIcon();

/* Detect a real touch device (iPad) rather than trusting the User-Agent string,
   since iPadOS Safari deliberately reports itself as a Mac in the UA. */
if(navigator.maxTouchPoints > 1){
  document.body.classList.add('touch-device');
}

/* Landing page <-> main app toggle */
document.getElementById('enterBtn').addEventListener('click', ()=>{
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
});
document.getElementById('exitBtn').addEventListener('click', ()=>{

});
