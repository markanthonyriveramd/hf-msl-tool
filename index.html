<style>
  :root{
    --deep:#00201B; --dark:#00332A; --brand:#00A76F; --accent:#00E58A;
    --bg:#F5F8F6; --card:#FFFFFF; --ink:#0C2420; --muted:#5C7269; --line:#DCE7E1;
    --evidence:#0FA36B; --limitation:#D8484C; --guideline:#3B6FD4; --practical:#B8860B;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; height:100dvh; margin:0; overflow:hidden; }
  html{ scrollbar-width:none; -ms-overflow-style:none; }
  html::-webkit-scrollbar{ display:none; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  body::-webkit-scrollbar{ display:none; }
  h1,h2,h3,.display{ font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:-0.01em; }


  .app{ position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; }

  /* ============ TOP HEADER ============ */
  /* ============ LANDING PAGE ============ */
  .landing{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(155deg,var(--deep) 0%, var(--dark) 65%, #014a3a 100%);
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .landing-inner{ max-width:560px; }
  .landing-badge{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-size:11px; font-weight:700; padding:6px 14px; border-radius:20px; letter-spacing:0.05em; margin-bottom:28px;
  }
  .landing-badge.internal-badge{ display:inline-flex; }
  .landing-title{
    font-family:'Manrope',sans-serif; font-weight:800; font-size:44px; line-height:1.15; color:#fff;
    margin:0 0 16px; letter-spacing:-0.01em;
  }
  .landing-sub{ font-size:15px; color:rgba(255,255,255,0.65); margin:0 0 40px; }
  .landing-enter{
    background:var(--accent); color:var(--deep); border:none; border-radius:12px; padding:14px 32px;
    font-size:15px; font-weight:800; font-family:'Inter',sans-serif; cursor:pointer; display:inline-flex;
    align-items:center; gap:10px; transition:transform 0.15s, box-shadow 0.15s;
  }
  .landing-enter:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,229,138,0.25); }

  /* ============ EXIT BUTTON (returns to landing page) ============ */
  .brand-name-group{ display:flex; align-items:center; gap:10px; transition:margin-left 0.15s; }
  body.fullscreen-active.touch-device .brand-name-group{ margin-left:64px; }
  .exit-btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff;
    width:28px; height:28px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    padding:0; flex:none;
  }
  .exit-btn:hover{ background:rgba(255,255,255,0.18); }
  .exit-btn svg{ width:14px; height:14px; }

  header.top{
    background:linear-gradient(155deg,var(--deep) 0%, var(--dark) 65%, #014a3a 100%);
    color:#fff; padding:calc(14px + env(safe-area-inset-top, 0px)) 20px 14px; flex:none;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .brand-name{ font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; }
  .internal-badge{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#fff;
    font-size:10.5px; font-weight:700; padding:5px 11px; border-radius:20px; letter-spacing:0.03em;
    display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  #fullscreenIcon svg{ width:11px; height:11px; }

  /* ============ TAB ROW ============ */
  .tab-row{
    display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .tab-row::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:none; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.75);
    font-size:12px; font-weight:700; padding:8px 16px; border-radius:9px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .tab-btn.active{ background:var(--accent); color:var(--deep); border-color:var(--accent); }
  .tab-btn-ref{ border-left:1px solid rgba(255,255,255,0.25); margin-left:4px; padding-left:20px; }
  .tab-btn-ref.active{ background:rgba(255,255,255,0.18); color:#fff; border-color:rgba(255,255,255,0.3); }

  /* ============ TOPIC PILLS ROW ============ */
  .topic-row{ background:var(--card); border-bottom:1px solid var(--line); padding:10px 20px; flex:none; }
  .topic-pills{
    display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .topic-pills::-webkit-scrollbar{ display:none; }
  .topic-pill{
    flex:none; background:var(--bg); border:1.5px solid var(--line); color:var(--ink); font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:9px; cursor:pointer; max-width:280px; text-align:left; line-height:1.35;
    height:72px; display:flex; align-items:center; overflow:hidden;
  }
  .topic-pill.active{ background:rgba(15,163,107,0.1); border-color:var(--evidence); color:var(--dark); }

  /* ============ TOPIC TITLE (full width, own row) ============ */
  .topic-title-row{ background:var(--card); padding:6px 20px 2px; flex:none; }
  .topic-eyebrow{ font-size:10.5px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:2px; }
  .topic-title{ font-size:19px; line-height:1.3; color:var(--deep); flex:1; }
  .title-and-insight{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .insight-btn{
    flex:none; display:flex; align-items:center; gap:6px; background:#FFF8E1; border:1.5px solid #E6C558;
    color:#7A5C00; font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:20px; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .insight-btn:hover{ background:#FFF0BD; }
  .insight-box{ display:none; background:#FFF8E1; border:1.5px solid #E6C558; border-radius:10px; padding:12px 14px; margin:10px 0 6px; }
  .insight-box.show{ display:block; }
  .insight-box-label{ font-size:10px; font-weight:800; color:#7A5C00; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
  .insight-box-text{ font-size:13px; line-height:1.55; color:#3D2E00; }

  /* ============ BULLET CHIP ROW (full width, BELOW the title) ============ */
  .bullet-row{ background:var(--card); padding:6px 20px 8px; border-bottom:1px solid var(--line); flex:none; }
  .bullet-chips{
    display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .bullet-chips::-webkit-scrollbar{ display:none; }
  .bullet-chip{
    flex:none; display:flex; align-items:center; gap:7px; background:var(--bg); border:1.5px solid var(--line);
    border-radius:20px; padding:7px 13px 7px 10px; cursor:pointer; max-width:220px; white-space:nowrap;
  }
  .bullet-chip.active{ background:var(--deep); border-color:var(--deep); }
  .bchip-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .bchip-dot.evidence{ background:var(--evidence); } .bchip-dot.limitation{ background:var(--limitation); }
  .bchip-dot.guideline{ background:var(--guideline); } .bchip-dot.practical{ background:var(--practical); }
  .bchip-text{ font-size:11.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bullet-chip.active .bchip-text{ color:#fff; }

  /* ============ FOCUSED CONTENT PANE ============ */
  .main{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .main-topbar{ padding:6px 20px 10px; display:flex; align-items:center; justify-content:space-between; flex:none; }
  .slide-counter{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .nav-btns{ display:flex; gap:8px; }
  .nav-btn{
    background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:6px 14px;
    font-size:12px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .nav-btn:disabled{ opacity:0.35; cursor:default; }

  .focus-content{ flex:1; padding:8px 20px calc(100px + env(safe-area-inset-bottom, 0px)); overflow-y:auto; overscroll-behavior-y:contain; scrollbar-width:none; -ms-overflow-style:none; }
  .focus-content::-webkit-scrollbar{ display:none; }
  .focus-inner{ max-width:760px; width:100%; margin:0 auto; padding-bottom:120px; }

  .focus-tagpill{
    display:inline-block; font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.03em; margin-bottom:12px;
  }
  .focus-tagpill.evidence{ background:rgba(15,163,107,0.15); color:var(--evidence); }
  .focus-tagpill.limitation{ background:rgba(216,72,76,0.15); color:var(--limitation); }
  .focus-tagpill.guideline{ background:rgba(59,111,212,0.15); color:var(--guideline); }
  .focus-tagpill.practical{ background:rgba(184,134,11,0.15); color:var(--practical); }

  .focus-headline{ font-size:20px; line-height:1.3; margin-bottom:18px; color:var(--deep); }

  .focus-chart-wrap{ margin-bottom:16px; }
  .bullet-chart{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; }

  .focus-detail-toggle{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--brand);
    cursor:pointer; margin-bottom:8px; user-select:none;
  }
  .focus-detail{ font-size:13.5px; line-height:1.75; color:var(--ink); max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .focus-detail.open{ max-height:900px; }
  .focus-detail-inner{ padding-top:4px; padding-bottom:6px; }

  .focus-citations{ margin-top:16px; margin-bottom:24px; padding-top:14px; border-top:1px dashed var(--line); }
  .focus-cite-line{ font-size:11px; color:var(--muted); line-height:1.6; display:flex; gap:6px; margin-bottom:6px; }
  .focus-cite-line a{ color:var(--brand); text-decoration:none; }
  .focus-cite-line a:hover{ text-decoration:underline; }
  .trial-name{ background:rgba(15,163,107,0.12); color:var(--evidence); font-weight:700; padding:1px 7px; border-radius:5px; }

  /* Chart styles */
  .chart-title{ font-size:11px; font-weight:700; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.03em; }
  .chart-compare{ display:flex; flex-direction:column; gap:8px; }
  .chart-compare-row{ display:flex; align-items:center; gap:10px; }
  .chart-compare-label{ flex:none; width:150px; font-size:11.5px; font-weight:600; color:var(--ink); text-align:right; }
  .chart-compare-track{ flex:1; background:#EEF2F0; border-radius:6px; height:22px; position:relative; overflow:hidden; }
  .chart-compare-fill{ height:100%; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
  .chart-compare-fill span{ font-size:10.5px; font-weight:700; color:#fff; font-family:'IBM Plex Mono',monospace; }
  .chart-badge-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .chart-badge{ flex:1; min-width:160px; border-radius:12px; padding:14px 16px; }
  .chart-badge .bclass{ font-family:'Manrope',sans-serif; font-weight:800; font-size:22px; margin-bottom:4px; }
  .chart-badge .blabel{ font-size:11.5px; font-weight:600; line-height:1.4; }
  .chart-hr{ display:flex; flex-direction:column; gap:12px; }
  .chart-hr-row{ display:flex; align-items:center; gap:10px; }
  .chart-hr-label{ flex:none; width:150px; font-size:11.5px; font-weight:600; color:var(--ink); line-height:1.35; }
  .chart-hr-line{ flex:1; position:relative; height:24px; }
  .chart-hr-axis{ position:absolute; top:50%; left:0; right:0; height:1px; background:var(--line); }
  .chart-hr-null{ position:absolute; top:0; bottom:0; width:1px; background:var(--muted); }
  .chart-hr-ci{ position:absolute; top:9px; height:6px; background:var(--brand); border-radius:3px; opacity:0.35; }
  .chart-hr-point{ position:absolute; top:6px; width:12px; height:12px; border-radius:50%; background:var(--dark); transform:translateX(-50%); border:2px solid #fff; box-shadow:0 0 0 1px var(--dark); }
  .chart-hr-value{ font-size:10.5px; font-family:'IBM Plex Mono',monospace; color:var(--muted); margin-top:2px; }

  .rd-wrap{ display:flex; flex-direction:column; gap:16px; }
  .rd-panel{ border:1.5px solid var(--line); border-radius:12px; padding:14px 14px 16px; background:#FBFCFB; }
  .rd-panel-title{ font-size:11.5px; font-weight:700; color:var(--dark); margin-bottom:12px; }
  .rd-stimuli-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .rd-stimulus{ background:rgba(216,72,76,0.1); border:1.5px solid var(--limitation); color:var(--limitation); font-size:11px; font-weight:600; padding:6px 12px; border-radius:20px; text-align:center; }
  .rd-blocker{ background:rgba(15,163,107,0.1); border:1.5px solid var(--evidence); color:var(--evidence); font-size:11px; font-weight:600; padding:6px 12px; border-radius:20px; text-align:center; }
  .rd-connector{ text-align:center; font-size:16px; color:var(--muted); margin:4px 0; line-height:1; }
  .rd-receptor{ background:#FBE5D0; border:1.5px solid #D6923F; color:#7A4E12; font-weight:700; font-size:12px; text-align:center; padding:10px; border-radius:8px; max-width:260px; margin:0 auto; }
  .rd-outcomes-row{ display:flex; gap:10px; margin-top:12px; align-items:flex-start; }
  .rd-outcome-box{ flex:1; background:var(--dark); color:#fff; border-radius:10px; padding:10px 12px; }
  .rd-outcome-title{ font-size:10.5px; font-weight:700; color:var(--accent); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.02em; }
  .rd-outcome-box ul{ margin:0; padding-left:16px; }
  .rd-outcome-box li{ font-size:10.5px; line-height:1.7; color:rgba(255,255,255,0.9); }
  .rd-outcomes-single{ background:var(--dark); color:#fff; border-radius:10px; padding:12px 14px; margin-top:10px; }
  .rd-outcomes-single .rd-cols{ display:flex; gap:14px; }
  .rd-outcomes-single .rd-col{ flex:1; }
  .rd-outcomes-single ul{ margin:0; padding-left:16px; }
  .rd-outcomes-single li{ font-size:10.5px; line-height:1.7; color:rgba(255,255,255,0.9); }

  /* ============ DUAL PATHWAY (two independent mechanisms, neutral styling) ============ */
  .dp-wrap{ display:flex; align-items:stretch; gap:0; }
  .dp-panel{ flex:1; border:1.5px solid var(--line); border-radius:12px; padding:14px 14px 16px; background:#FBFCFB; display:flex; flex-direction:column; }
  .dp-panel-title{ font-size:12px; font-weight:800; font-family:'Manrope',sans-serif; color:var(--dark); margin-bottom:10px; text-align:center; }
  .dp-trigger{ background:rgba(92,114,105,0.1); border:1.5px solid var(--muted); color:var(--dark); font-size:11px; font-weight:600; padding:6px 12px; border-radius:20px; text-align:center; margin:0 auto 8px; display:inline-block; }
  .dp-trigger-row{ text-align:center; }
  .dp-connector{ text-align:center; font-size:15px; color:var(--muted); line-height:1; margin:2px 0; }
  .dp-target{ background:#EEF2F0; border:1.5px solid var(--dark); color:var(--dark); font-weight:700; font-size:11.5px; text-align:center; padding:10px; border-radius:8px; margin-bottom:10px; }
  .dp-outcomes{ background:var(--dark); color:#fff; border-radius:8px; padding:10px 12px; margin-top:auto; }
  .dp-outcomes ul{ margin:0; padding-left:14px; }
  .dp-outcomes li{ font-size:10px; line-height:1.65; color:rgba(255,255,255,0.9); }
  .dp-divider{ flex:none; width:44px; display:flex; align-items:center; justify-content:center; }
  .dp-divider-inner{ font-size:18px; font-weight:800; color:var(--muted); }
  @media (max-width: 700px){
    .dp-wrap{ flex-direction:column; gap:10px; }
    .dp-divider{ width:100%; height:24px; }
  }

  /* ============ INTERACTIVE CALCULATOR (ported from PCP screening tool) ============ */
  .calc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .calc-card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:18px; }
  .calc-card h3{ font-size:15px; margin:0 0 4px; color:var(--dark); }
  .calc-hint{ margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.5; }
  .calc-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .calc-field{ display:flex; flex-direction:column; gap:5px; }
  .calc-field.full{ grid-column:1 / -1; }
  .calc-field label{ font-size:11.5px; font-weight:600; color:var(--ink); }
  .calc-field input[type=number]{
    border:1.5px solid var(--line); border-radius:10px; padding:9px 10px; font-size:14px;
    font-family:'IBM Plex Mono',monospace; color:var(--ink); background:#FBFCFB; outline:none; width:100%;
  }
  .calc-field input:focus{ border-color:var(--brand); background:#fff; }
  .calc-seg{ display:flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; }
  .calc-seg button{ flex:1; border:none; background:#FBFCFB; padding:9px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; border-right:1.5px solid var(--line); }
  .calc-seg button:last-child{ border-right:none; }
  .calc-seg button.on{ background:var(--dark); color:#fff; }
  .calc-btn-row{ display:flex; gap:10px; margin-top:14px; }
  .calc-btn{ flex:1; border-radius:10px; padding:11px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; border:1.5px solid var(--line); }
  .calc-btn-primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .calc-btn-primary:hover{ background:var(--dark); }
  .calc-btn-reset{ background:#fff; color:var(--muted); }
  .calc-btn-reset:hover{ background:var(--bg); }
  .calc-results{ background:linear-gradient(160deg,var(--deep), var(--dark)); color:#fff; border-radius:14px; padding:18px; }
  .calc-results h3{ font-size:15px; margin:0 0 4px; color:var(--accent); }
  .calc-gauge-wrap{ display:flex; flex-direction:column; align-items:center; padding:6px 0 4px; }
  .calc-gauge-num{ font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:600; margin-top:-42px; color:#fff; }
  .calc-gauge-cat{ font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; padding:5px 14px; border-radius:999px; margin-top:8px; }
  .calc-cat-low{ background:rgba(15,163,107,0.18); color:#5FEBB2; border:1px solid rgba(95,235,178,0.4); }
  .calc-cat-interm{ background:rgba(225,160,39,0.18); color:#F5C15E; border:1px solid rgba(245,193,94,0.4); }
  .calc-cat-high{ background:rgba(216,72,76,0.18); color:#F58D90; border:1px solid rgba(245,141,144,0.4); }
  .calc-cat-neutral{ background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.2); }
  .calc-action-box{
    margin-top:14px; font-size:12.5px; line-height:1.65; color:#fff; background:rgba(255,255,255,0.09);
    border-radius:10px; padding:12px 13px; border-left:3px solid var(--accent);
  }
  .calc-action-box b{ display:block; margin-bottom:4px; font-size:13px; }
  .calc-ntprobnp-box{ margin-top:12px; background:rgba(255,255,255,0.06); border-radius:10px; padding:12px 13px; display:none; }
  .calc-ntprobnp-box.show{ display:block; }
  .calc-ntprobnp-box label{ font-size:11.5px; font-weight:600; display:block; margin-bottom:6px; }
  .calc-ntprobnp-box input{ width:100%; border:1.5px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.08); color:#fff; border-radius:8px; padding:8px 9px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .calc-ntprobnp-result{ margin-top:9px; font-size:12px; line-height:1.6; display:none; }
  .calc-ntprobnp-result.show{ display:block; }
  .calc-disclaimer{ font-size:10.5px; color:var(--muted); line-height:1.6; margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); }
  @media (max-width: 700px){
    .calc-grid{ grid-template-columns:1fr; }
  }

  /* ============ INTERCEPT PATHWAY (one sequential pathway, two block points marked) ============ */
  .ip-wrap{ display:flex; flex-direction:column; align-items:center; max-width:480px; margin:0 auto; }
  .ip-stage{ background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:10px 18px; text-align:center; font-weight:700; font-size:13px; color:var(--ink); width:100%; }
  .ip-stage-sub{ display:block; font-weight:500; font-size:10.5px; color:var(--muted); margin-top:2px; }
  .ip-arrow{ font-size:14px; color:var(--muted); line-height:1; padding:3px 0; }
  .ip-stage.highlight{ background:rgba(15,163,107,0.08); border-color:var(--evidence); }
  .ip-stage.highlight .ip-stage-sub{ color:var(--evidence); font-weight:700; }
  .ip-stage.alert{ background:rgba(216,72,76,0.08); border-color:var(--limitation); }
  .ip-intercept{ display:flex; align-items:center; gap:10px; width:100%; margin:2px 0 2px 28px; padding:8px 12px; border-radius:9px; border-left-width:3px; border-left-style:solid; }
  .ip-intercept-asi{ background:rgba(184,134,11,0.08); border-left-color:var(--practical); }
  .ip-intercept-mra{ background:rgba(15,163,107,0.08); border-left-color:var(--evidence); }
  .ip-intercept-label{ flex:none; font-family:'Manrope',sans-serif; font-weight:800; font-size:11.5px; padding:3px 9px; border-radius:6px; color:#fff; }
  .ip-intercept-asi .ip-intercept-label{ background:var(--practical); }
  .ip-intercept-mra .ip-intercept-label{ background:var(--evidence); }
  .ip-intercept-text{ font-size:11px; line-height:1.4; color:var(--ink); }

  /* ============ HF DIAGNOSTIC ALGORITHM (ESC Figure 4 style flowchart) ============ */
  .dxflow-wrap{ width:100%; overflow-x:auto; }
  .dxflow-wrap svg{ display:block; margin:0 auto; min-width:940px; }
  .dxflow-box{ font-family:'Inter',sans-serif; font-size:15px; font-weight:600; fill:#1B2430; text-anchor:middle; }
  .dxflow-box tspan{ font-size:15px; font-weight:500; }
  .dxflow-label{ font-family:'Inter',sans-serif; font-size:13px; fill:#1B2430; text-anchor:middle; }
  .dxflow-yn{ font-family:'Manrope',sans-serif; font-size:14px; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:middle; }

  /* ============ TRIPLE LIST (Table 12 style: 3 parallel columns) ============ */
  .trilist-wrap{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .trilist-col{ border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .trilist-head{ background:#C7CBCE; color:var(--dark); font-weight:800; font-size:12.5px; text-align:center; padding:10px 8px; }
  .trilist-body{ background:#EFEFEF; padding:12px 14px; }
  .trilist-body ul{ margin:0; padding-left:16px; }
  .trilist-body li{ font-size:12px; line-height:1.9; color:var(--ink); }
  @media (max-width: 700px){
    .trilist-wrap{ grid-template-columns:1fr; }
  }

  /* ============ HF STAGES DIAGRAM (ESC Figure 2 style) ============ */
  .hfstage-wrap{ width:100%; overflow-x:auto; }
  .hfstage-wrap svg{ display:block; margin:0 auto; min-width:820px; }
  .hfstage-title{ font-family:'Manrope',sans-serif; font-size:15px; font-weight:800; text-anchor:middle; }
  .hfstage-sub{ font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; text-anchor:middle; }
  .hfstage-desc{ font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; fill:#1B2430; }
  .hfstage-hf{ font-family:'Inter',sans-serif; font-size:14px; font-weight:700; fill:#1B2430; text-anchor:middle; }

  /* ============ THERAPY PYRAMID (ESC Figure 3 style) ============ */
  .pyramid-wrap{ width:100%; overflow-x:auto; }
  .pyramid-wrap svg{ display:block; margin:0 auto; min-width:520px; }
  .pyramid-big{ font-family:'Manrope',sans-serif; font-size:22px; font-weight:800; fill:#1B2430; text-anchor:middle; }
  .pyramid-small{ font-family:'Inter',sans-serif; font-size:13px; font-weight:700; fill:#1B2430; text-anchor:middle; }

  /* ============ FMT STRATEGIC FUNNEL ============ */
  .funnel-wrap{ display:flex; flex-direction:column; align-items:center; gap:0; max-width:540px; margin:0 auto; }
  .funnel-stage{ background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:12px 18px; text-align:center; width:100%; }
  .funnel-stage-title{ font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  .funnel-stage-drugs{ font-size:14px; font-weight:700; color:var(--ink); }
  .funnel-stage.core{ background:rgba(15,163,107,0.08); border-color:var(--evidence); }
  .funnel-stage.core .funnel-stage-drugs{ color:var(--evidence); }
  .funnel-arrow{ font-size:16px; color:var(--muted); padding:4px 0; line-height:1; }
  .funnel-branches{ display:flex; gap:12px; width:100%; margin-top:2px; }
  .funnel-branch{ flex:1; background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
  .funnel-branch-label{ font-weight:800; font-size:11px; color:var(--brand); margin-bottom:4px; }
  .funnel-branch-text{ font-size:12px; color:var(--ink); line-height:1.4; }
  .table-link-btn{ display:inline-block; background:var(--brand); color:#fff !important; font-size:11px; font-weight:700; padding:5px 12px; border-radius:20px; text-decoration:none; white-space:nowrap; }

s0: {

s1: {
  cat: "screening", title: "HFpEF-ABA Screening Tool — Is It Good Enough, Easy, Practical?",
  insight: "How do you currently screen for and diagnose HFpEF in your practice today, and how would you rate the quality of referrals you receive for suspected HFpEF?",
  bullets: [
    { tag:"guideline", label:"What is the HFpEF-ABA score? A quick primer",
      detail:"HFpEF-ABA stands for the three variables the score is built from: Age, BMI, and Atrial fibrillation history. It's a simple logistic-regression-based probability score using only these three universally available clinical variables \u2014 no echocardiogram, no NT-proBNP, no specialist equipment required. It was developed precisely because HFpEF is widely under-recognized, and existing diagnostic tools (echo, natriuretic peptides) aren't always accessible or practical for first-line screening, especially in primary care.",
      chart:{type:"badge", items:[
        {value:"A", label:"Age (years)", color:"guideline"},
        {value:"B", label:"BMI \u2014 Body Mass Index (kg/m\u00b2)", color:"guideline"},
        {value:"A", label:"Atrial Fibrillation (history of)", color:"guideline"}
      ]},
      citation:"Reddy YNV, Carter RE, Sundaram V, et al. An evidence-based screening tool for heart failure with preserved ejection fraction: the HFpEF-ABA score. Nat Med. 2024;30(8):2258\u20132264.", url:"https://www.nature.com/articles/s41591-024-03140-1" },
    { tag:"evidence", label:"Consistently picks out the right patient, across three separate test groups",
      detail:"If you compared one patient who truly has HFpEF against one who doesn't, the tool correctly identifies which one has HFpEF roughly 8 times out of 10 \u2014 in the original derivation group, and again when tested independently in two other patient groups. That consistency across separate populations is what makes it reliable, not just accurate once. Uses only age, BMI, and AF history \u2014 no imaging required, unlike H2FPEF or HFA-PEFF. (Statistically, this is expressed as AUC: 0.839 derivation, 0.813 international validation, 0.840 unexplained-dyspnea cohort.)",
      chart:{type:"badge", items:[
        {value:"~8 in 10", label:"Derivation group (n=414): correctly tells apart a patient with HFpEF from one without", color:"evidence"},
        {value:"~8 in 10", label:"Independent international group (n=736): same result", color:"evidence"},
        {value:"~8 in 10", label:"Unexplained-dyspnea group (n=228): same result", color:"evidence"}
      ]},
      citation:"Reddy YNV, et al. An evidence-based screening tool for HFpEF: the HFpEF-ABA score. Nat Med. 2024;30(8):2258\u20132264.", url:"https://www.nature.com/articles/s41591-024-03140-1" },
    { tag:"guideline", label:"2026 ACC Expert Consensus positions it as the primary care/EMR screening tool of choice",
      detail:"The pathway states HFpEF-ABA \u2018would function most readily as a screening tool in the primary care setting or in the electronic medical record.\u2019 In cardiology practices where echo data is already available, H2FPEF may be more accurate despite using fewer variables \u2014 a useful distinction when a cardiologist asks why a PCP-facing score matters to them. This is a positioning statement in the consensus pathway, not a formal Class/Level of Evidence rating \u2014 HFpEF-ABA is a screening instrument, not a graded therapy recommendation.",
      chart:{type:"badge", items:[
        {value:"Primary care / EMR", label:"HFpEF-ABA positioned as the tool of choice here", color:"evidence"},
        {value:"Cardiology + echo access", label:"H2FPEF may be preferred here instead", color:"guideline"}
      ]},
      citation:"Management of HFpEF: 2026 ACC Expert Consensus Decision Pathway. JACC. 2026.", url:"https://www.jacc.org/doi/10.1016/j.jacc.2026.06.018" },
    { tag:"limitation", label:"Prognostic value in already-diagnosed HFpEF is modest \u2014 it's a screening tool, not a risk stratifier",
      detail:"In a TOPCAT secondary analysis of already-diagnosed HFpEF patients, higher HFpEF-ABA probability was only modestly associated with HF hospitalization (HR 1.07 per 10% increase, 95% CI 1.00\u20131.14) and showed no significant association with mortality. It performs best as an upstream triage tool \u2014 not for risk-stratifying patients who already carry a confirmed diagnosis.",
      chart:{type:"pathway", title:"What it's for vs. what it isn't", connector:"\u2260",
        items:[
          {title:"\u2713 Screening tool", subtitle:"Used before diagnosis, to flag which patients need echo/NT-proBNP workup", bg:"rgba(15,163,107,0.08)", border:"var(--evidence)", color:"var(--evidence)"},
          {title:"\u2717 Not a risk stratifier", subtitle:"In confirmed HFpEF: HR 1.07 for HF hospitalization, not significant for mortality", bg:"rgba(216,72,76,0.08)", border:"var(--limitation)", color:"var(--limitation)"}
        ]},
      citation:"Zhu W, Guo L, Chen X, Ye M. Prognostic Utility of the HFpEF-ABA Score for HFpEF Patients: Insights From the TOPCAT Trial. JACC Adv. 2026;5(3):102632.", url:"https://www.jacc.org/doi/10.1016/j.jacadv.2026.102632" },
    { tag:"practical", label:"Practical positioning: pre-echo triage, not a diagnostic determination",
      detail:"Given a probability output, ABA is best positioned as prioritizing which patients need echo/NT-proBNP workup \u2014 not as a stand-alone diagnosis. For cardiologists who already order echo routinely, ABA adds limited incremental value over their existing workup; its real value proposition is upstream, in primary care.",
      chart:{type:"pathway", title:"What it's for vs. what it isn't", connector:"\u2260",

s2: {
  cat: "screening", title: "HFpEF Diagnosis — NT-proBNP Utilization by Cardiologists & GPs",
  insight: "What's your perspective on the current gaps in HFpEF diagnosis, and where do tools like NT-proBNP and the ABA score fit \u2014 or fall short \u2014 in your day-to-day practice?",
  bullets: [
    { tag:"guideline", label:"What is NT-proBNP? A quick primer",
      detail:"NT-proBNP stands for N-terminal pro-B-type Natriuretic Peptide. When cardiac myocytes \u2014 mainly in the ventricles \u2014 experience wall stress from volume or pressure overload, they synthesize and release a prohormone, proBNP, which is cleaved into two fragments: biologically active BNP (which has natriuretic, diuretic, and vasodilatory effects) and biologically inactive NT-proBNP. NT-proBNP has a longer half-life and is more stable in blood, which is why it's the preferred fragment for clinical lab testing even though BNP itself is the active hormone. Elevated levels reflect myocardial wall stress and are used both to rule out HF at low values and support the diagnosis at elevated ones.",
      chart:{type:"badge", items:[
        {value:"Wall stress", label:"Triggers release from cardiac myocytes, mainly ventricular", color:"guideline"},
        {value:"proBNP \u2192 BNP + NT-proBNP", label:"Cleaved into active BNP and inactive NT-proBNP", color:"guideline"},
        {value:"Longer half-life", label:"NT-proBNP is more stable in blood \u2014 the preferred lab biomarker", color:"guideline"}
      ]},
      citation:"Bayes-Genis A, Docherty KF, Petrie MC, et al. Practical algorithms for early diagnosis of heart failure and heart stress using NT-proBNP: A clinical consensus statement from the Heart Failure Association of the ESC. Eur J Heart Fail. 2023;25(11):1891\u20131898.", url:"https://onlinelibrary.wiley.com/doi/full/10.1002/ejhf.3036" },
    { tag:"guideline", label:"Diagnostic threshold varies meaningfully by region",
      detail:"ESC and AHA recommend a 125 pg/mL threshold for a positive outpatient test. UK NICE recommends 400 pg/mL instead \u2014 the applicable threshold depends on which guideline body governs the market where the HCP practices.",
      chart:{type:"compare", title:"NT-proBNP positive threshold by guideline body", unit:"pg/mL", max:450,
        rows:[{label:"ESC / AHA", value:125},{label:"UK NICE", value:400}]},
      citation:"Taylor CJ, Ord\u00f3\u00f1ez-Mena JM, Lay-Flurrie SL, et al. Natriuretic peptide testing and heart failure diagnosis in primary care: diagnostic accuracy study. Br J Gen Pract. 2023;73(726):e1\u2013e8.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC9799346" },
    { tag:"limitation", label:"Atrial fibrillation confounds interpretation \u2014 the same population flagged by HFpEF-ABA",
      detail:"In a chronic HF cohort, median NT-proBNP was roughly 2.8x higher in patients with AF than in sinus rhythm, independent of true HF status. Since AF is one of only three HFpEF-ABA inputs, this creates a genuine interpretive tension: AF patients are simultaneously flagged as high pre-test probability by ABA, while their NT-proBNP result is inherently less specific.",
      chart:{type:"compare", title:"Median NT-proBNP by cardiac rhythm (chronic HF)", unit:"pg/mL", max:2800,
        rows:[{label:"Sinus rhythm", value:899}, {label:"Atrial fibrillation", value:2528}]},
      citations:[
        {citation:"Heart failure diagnosis: impacts of atrial fibrillation on NT-proBNP. PLOS Medicine. 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12578210/"},
        {citation:"Corell P, et al. Effect of atrial fibrillation on plasma NT-proBNP in chronic heart failure. Int J Cardiol. 2007;117(3):395\u2013402.", url:"https://pubmed.ncbi.nlm.nih.gov/16919342/"}
      ] },
    { tag:"limitation", label:"Obesity suppresses NT-proBNP, risking false-negative rule-out",
      detail:"Elevated BMI is a recognized cause of falsely low NT-proBNP \u2014 meaning standard thresholds may under-detect HFpEF in obese patients, a population that overlaps substantially with the broader cardio-renal-metabolic HFpEF phenotype. A large prospective multi-site emergency department study (PRECISE-HF) found the standard rule-out threshold misses cases in patients with BMI \u226530 kg/m\u00b2, and found sensitivity and negative predictive value improved using a lower, obesity-adjusted threshold instead.",
      chart:{type:"compare", title:"NT-proBNP rule-out threshold, standard vs. obesity-adjusted", unit:"ng/L", max:320,
        rows:[{label:"Standard threshold", value:300}, {label:"BMI \u226530 kg/m\u00b2 (adjusted)", value:150}]},
      citation:"Allen B, Peacock WF, Headden G, et al. PRECISE-HF: Optimizing NT-proBNP diagnostic performance in the patient with obesity. Eur Heart J. 2025;46(Suppl 1):ehaf784.1147.", url:"https://academic.oup.com/eurheartj/article/46/Supplement_1/ehaf784.1147/8308563" },
    { tag:"practical", label:"Real-world access and pathway gaps remain common even where testing exists",
      detail:"A multi-country HFA survey found 40% of respondent clinicians lacked a formal diagnostic referral pathway for elevated natriuretic peptides in their area, and roughly one-third lacked access to NP testing in the community setting at all \u2014 an access problem, not just an interpretation problem.",
      chart:{type:"badge", items:[{value:"40%", label:"lack a formal referral pathway", color:"limitation"},{value:"~33%", label:"lack community NP testing access", color:"limitation"}]},
      citation:"Awareness, access, and adoption of natriuretic peptides for diagnosis of heart failure. ESC HFA survey, PMC. 2025.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11770566/" },
    { tag:"practical", label:"When NT-proBNP isn't available: BNP and MR-proANP are guideline-recognized alternatives",
      detail:"The 2026 ESC Guidelines explicitly acknowledge that NT-proBNP testing is not universally available, and that some regions instead use BNP or mid-regional pro-atrial natriuretic peptide (MR-proANP) testing. All three have established non-acute rule-out thresholds. This gives EEs and HCPs in lower-testing-access settings a legitimate guideline-sourced path forward — the absence of NT-proBNP specifically doesn't mean natriuretic-peptide-based screening is off the table.",
      chart:{type:"table", title:"Non-acute rule-out thresholds (HF unlikely below these levels)", columns:["Threshold"],

          {label:"BNP", values:["&lt;35 pg/mL"]},
          {label:"MR-proANP", values:["&lt;40 pmol/L"]}
        ]},

  ]

s2c: {
  cat: "screening", title: "Heart Failure Stages & Classification — A Quick Refresher",
  insight: "Where do most of your referred patients tend to land on this staging framework \u2014 and do you find Stage B (Pre-Heart Failure) patients are being identified early enough in your practice?",
  bullets: [
    { tag:"guideline", label:"From at-risk to advanced disease: the four ESC stages of heart failure",
      detail:"This is Figure 2 exactly as published in the 2026 ESC Heart Failure Guidelines. Stage A and B patients have no current or prior HF symptoms \u2014 they're distinguished by risk factors alone (A) versus objective structural, functional, or biomarker evidence of early disease (B). Stage C is where the HFrEF/HFpEF split happens, based on current or prior symptoms with a structural or functional abnormality. Stage D is reserved for severe, refractory disease despite optimal therapy across all three modern therapy categories \u2014 foundational, additional, and interventional.",
      chart:{type:"hf-stages", title:"Heart failure stages and classification (2026 ESC Guidelines, Figure 2)"},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"practical", label:"Stage C isn't static: from symptomatic diagnosis to deterioration and decompensation",
      detail:"This is a point many PCPs and even some non-HF specialists miss: Stage C is not a single fixed state, it's a trajectory. A patient is diagnosed symptomatic (Stage C), started on chronic FMT, and may remain clinically stable for a long period \u2014 but can deteriorate, entering decompensated HF (DHF). The 2026 ESC Guidelines deliberately replaced the older term \"acute HF\" with \"decompensated HF,\" because deterioration doesn't always happen suddenly \u2014 it can unfold over hours, or progressively over days to weeks. Critically, DHF is an event, not a new stage: it can occur in a Stage C or Stage D patient, and the A\u2013D staging still describes the underlying disease state throughout.",
      chart:{type:"stage-flow", title:"Stage C's trajectory", stages:[
        {label:"Symptomatic HF diagnosed", sub:"Stage C begins"},
        {label:"Chronic FMT, clinically stable"},
        {label:"Deterioration", sub:"Hours to weeks \u2014 not always sudden"},
        {label:"Decompensated HF (DHF)", sub:"An event, not a new stage", alert:true}
      ]},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"practical", label:"The three-phase in-hospital DHF framework \u2014 and exactly where SGLT2i initiation fits",
      detail:"This directly connects to the in-hospital SGLT2i initiation recommendation covered in the Treatment section. The 2026 ESC Guidelines introduce a three-phase framework (Figure 12) for managing DHF in hospital. Phase 1 focuses on identifying the trigger (e.g. ACS, arrhythmia, infection, non-adherence) and assessing congestion and perfusion to stabilize the patient. Phase 2, stabilization, is the critical window: once initially stabilized, the guideline states it is feasible and safe to start or optimize FMT \u2014 and this is specifically where in-hospital SGLT2i initiation is recommended, Class I, Level B1. Phase 3 shifts to pre-discharge and early post-discharge care: confirming adequate decongestion, FMT optimized before the patient leaves, and close early follow-up arranged.",
      chart:{type:"stage-flow", title:"In-hospital DHF management (2026 ESC Guidelines, Figure 12)", stages:[
        {label:"Phase 1: Initial management", sub:"Identify trigger \u00b7 assess congestion & perfusion \u00b7 stabilize"},
        {label:"Phase 2: Stabilization", sub:"Start/optimize FMT \u2014 initiate SGLT2i here (Class I, B1)", highlight:true},
        {label:"Phase 3: Pre-discharge & early post-discharge", sub:"Confirm decongestion \u00b7 FMT optimized \u00b7 early follow-up"}
      ]},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" }
  ]
},

      detail:"The Heart Failure Association has issued dedicated diagnostic pathway algorithms for both emergency department and community settings, specifically intended to standardize the handoff from primary-care flagging to specialist confirmation.",

    { tag:"guideline", label:"2026 ACC pathway frames a positive ABA result as triggering options, not a mandate",
      detail:"The consensus pathway states HFpEF-ABA probability should prompt \u2018further imaging, natriuretic peptide testing, cardiology referral, or all of these\u2019 \u2014 giving PCPs a menu of next steps rather than mandating immediate specialist referral for every flagged patient, which may ease bottleneck concerns where implemented well.",

t1: {
  cat: "treatment", title: "SGLT2 Inhibitors — Standard of Care in All HFpEF?",
  insight: "Are you using SGLT2 inhibitors as a foundational therapy in all your HFpEF patients? If not, what's holding that back?",
  bullets: [
    { tag:"guideline", label:"Class I, Level A \u2014 reconfirmed as foundational therapy in the 2026 ESC Guidelines",
      detail:"The 2026 ESC Guidelines recommend an SGLT2i (dapagliflozin or empagliflozin) for symptomatic HF independent of LVEF, Class I, Level A \u2014 reconfirming the position established in the 2023 Focused Update. Under the new 2026 framework, GDMT is now an umbrella term split into Foundational Medical Therapy (FMT) and Additional Medical Therapy (AMT); for HFpEF, FMT consists of SGLT2i and MRA together \u2014 both now Class I, Level A (MRA was upgraded from Class IIb, Level C; see the MRA topic for details).",
      chart:{type:"badge", items:[{value:"I / A", label:"SGLT2i \u2014 foundational therapy, all LVEF (2026 ESC)", color:"evidence"}]},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"guideline", label:"New nomenclature: Foundational, Additional, and Guideline Directed Interventional Therapy",
      detail:"This is Figure 3 exactly as published in the 2026 ESC Heart Failure Guidelines. Guideline-Directed Medical Therapy (GDMT) is now an umbrella term covering two tiers: Foundational Medical Therapy (FMT) \u2014 the broad base every eligible patient should be on \u2014 and Additional Medical Therapy (AMT), layered on top for specific situations. Guideline Directed Interventional Therapy (GDIT) sits alongside AMT as a separate, device- or procedure-based category. SGLT2i sits within FMT for HFpEF, alongside MRA \u2014 both are now Class I, Level A foundational agents under this framework.",
      chart:{type:"therapy-pyramid", title:"New nomenclature for heart failure therapies (2026 ESC Guidelines, Figure 3)"},
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"guideline", label:"SGLT2i and MRA are the only two pillars that are FMT across the entire LVEF spectrum",
      detail:"The 2026 ESC framework reconceives the traditional four pillars. ARNI/ACE-I/ARB and beta-blockers remain FMT, but only for HFrEF \u2014 in HFpEF they drop to IIb, Level C (\"may be considered... to reduce the risk of HFH\"), not a foundational recommendation. SGLT2i and MRA are the only two classes that clear the bar as LVEF-independent FMT: Class I, Level A in both HFrEF and HFpEF. The strategic picture: every HF patient, regardless of LVEF, starts on SGLT2i + MRA \u2014 then HFrEF patients layer on ARNI/ACE-I/ARB and a beta-blocker, while HFpEF patients layer on additional therapies selected by phenotype and comorbidities. The guideline calls for FMT uptitration at least every 1\u20132 weeks, guided by symptoms, vital signs, and laboratory findings, continuing at the highest tolerated dose even if the patient becomes asymptomatic or LVEF improves.",
      chart:[
        {type:"table", title:"2026 ESC FMT framework by pillar and phenotype", columns:["HFrEF","HFpEF"],
          rows:[
            {label:"SGLT2 inhibitor", values:["FMT \u2014 I, A","FMT \u2014 I, A"]},
            {label:"MRA", values:["FMT \u2014 I, A","FMT \u2014 I, A"]},
            {label:"ARNI / ACE-I / ARB", values:["FMT \u2014 I, A","IIb, C (not FMT)"]},
            {label:"Beta-blocker", values:["FMT \u2014 I, A","Not FMT"]}
          ]},
        {type:"fmt-funnel", title:"The strategic picture"}
      ],
      citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302" },
    { tag:"evidence", label:"Benefit is now shown to be uniform across the entire LVEF spectrum, including \u226560%",
      detail:"A 2026 prespecified pooled analysis of EMPEROR-Preserved and DELIVER (n=12,251) found a 20% risk reduction overall (HR 0.80, 95% CI 0.73\u20130.87), consistent across LVEF <50% (HR 0.76), 50\u201359% (HR 0.79), and \u226560% (HR 0.82) \u2014 interaction P=0.690, meaning no statistically meaningful heterogeneity. This directly resolves earlier uncertainty about whether benefit fades at higher EF.",
      chart:{type:"hr", title:"Primary endpoint HR by LVEF subgroup (95% CI)", rows:[
        {label:"LVEF <50%", hr:0.76, lo:0.65, hi:0.89},
        {label:"LVEF 50\u201359%", hr:0.79, lo:0.68, hi:0.92},
        {label:"LVEF \u226560%", hr:0.82, lo:0.71, hi:0.96}
      ]},
      citation:"Uniform efficacy of SGLT2 inhibitors across the ejection fraction spectrum: prespecified pooled analysis. 2026.", url:"https://pubmed.ncbi.nlm.nih.gov/41908059/" },
    { tag:"evidence", label:"EMPEROR-Preserved: 21% relative risk reduction in the primary composite endpoint",
      detail:"Empagliflozin reduced the composite of cardiovascular death or HF hospitalization by 21% relative risk versus placebo, consistent across prespecified subgroups including diabetes status. The benefit separated early and was sustained: statistically significant by day 18 (HR 0.41, 95% CI 0.17\u20130.99), maintained for the rest of the trial's ~26-month median follow-up.",
      chart:[
        {type:"hr", title:"EMPEROR-Preserved primary results (HR, 95% CI)", rows:[
          {label:"Primary composite<br>(CV death or HHF)", hr:0.79, lo:0.69, hi:0.90},
          {label:"HF hospitalization<br>(component)", hr:0.73, lo:0.61, hi:0.88}
        ]},
        {type:"badge", items:[
          {value:"NNT \u2248 30", label:"Primary composite \u2014 patients treated ~26 months to prevent one event", color:"evidence"},
          {value:"NNT \u2248 31", label:"HF hospitalization alone \u2014 patients treated ~26 months to prevent one event", color:"evidence"}
        ]}
      ],
      citation:"Anker SD, et al. Empagliflozin in Heart Failure with a Preserved Ejection Fraction. N Engl J Med. 2021;385:1451\u20131461.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2107038" },
    { tag:"limitation", label:"No significant reduction in cardiovascular mortality alone",
      detail:"EMPEROR-Preserved found a numerical but not statistically significant reduction in cardiovascular death alone (HR 0.91, 95% CI 0.76\u20131.09). This is a trial-design issue, not necessarily an absence of effect: the trial was powered to detect a difference in the primary composite endpoint (CV death or HF hospitalization), not to independently confirm significance for the CV-death component by itself \u2014 the same pattern seen in dapagliflozin's parallel DELIVER trial. Separately, in patients with type 2 diabetes and established cardiovascular disease, empagliflozin reduced CV death by 38% in EMPA-REG OUTCOME (HR 0.62, 95% CI 0.49\u20130.77) \u2014 a different trial and a different population, not a resolution of the HFpEF-specific finding above. Even within EMPA-REG, the small subgroup with a predicted-HFpEF-like phenotype did not reach significance for this outcome (HR 0.60, 95% CI 0.31\u20131.17), so this mortality signal should not be presented as HFpEF-specific.",
      chart:{type:"hr", title:"CV death: HFpEF trial vs. a different population (HR, 95% CI)", rows:[
        {label:"EMPEROR-Preserved<br>(HFpEF)", hr:0.91, lo:0.76, hi:1.09},
        {label:"EMPA-REG OUTCOME<br>(T2DM + established CVD)", hr:0.62, lo:0.49, hi:0.77},
        {label:"EMPA-REG, predicted-<br>HFpEF-like subgroup", hr:0.60, lo:0.31, hi:1.17}
      ]},
      citations:[
        {citation:"Anker SD, et al. Empagliflozin in Heart Failure with a Preserved Ejection Fraction. N Engl J Med. 2021;385:1451\u20131461.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2107038"},
        {citation:"Zinman B, Wanner C, Lachin JM, et al. Empagliflozin, Cardiovascular Outcomes, and Mortality in Type 2 Diabetes (EMPA-REG OUTCOME). N Engl J Med. 2015;373:2117\u20132128.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa1504720"},
        {citation:"Savarese G, Uijl A, Lund LH, et al. Empagliflozin in Heart Failure With Predicted Preserved Versus Reduced Ejection Fraction: Data From the EMPA-REG OUTCOME Trial. J Card Fail. 2021;27(8):888\u2013895.", url:"https://onlinejcf.com/article/S1071-9164(21)00202-5/fulltext"}
      ] },
    { tag:"guideline", label:"2026 ESC Guidelines expand SGLT2i's role further \u2014 now including in-hospital initiation during decompensated HF",
      detail:"MRA's HFpEF upgrade to Class I/A came from a retrospective pooled meta-analysis of existing trials (TOPCAT + FINEARTS-HF), not a new prospective trial. SGLT2i, by contrast, picked up a genuinely new, dedicated recommendation in this same 2026 update: in-hospital initiation of an SGLT2i after initial stabilization in decompensated HF is now Class I, Level B1. MRA has no equivalent new decompensated-HF-specific recommendation in this update.",
      chart:[
        {type:"badge", items:[{value:"I / B1", label:"New in 2026: in-hospital SGLT2i initiation after stabilization in decompensated HF", color:"evidence"}]},
        {type:"hr", title:"EMPULSE primary outcome (win ratio, 95% CI)", statLabel:"Win ratio", rows:[{label:"Clinical benefit<br>(hierarchical composite)", hr:1.36, lo:1.09, hi:1.68}]}
      ],
      afterChart:"This is underpinned by <span class=\"trial-name\">EMPULSE</span> (n=530): empagliflozin started a median of 3 days after admission, once stable, produced a statistically significant clinical benefit vs. placebo (win ratio 1.36, 95% CI 1.09\u20131.68, P=0.0054), with no evidence of treatment interaction across tested subgroups \u2014 consistent whether patients had HFrEF or HFpEF, and whether HF was de novo or decompensated chronic.",
      citations:[
        {citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302"},
        {citation:"Voors AA, Angermann CE, Teerlink JR, et al. The SGLT2 inhibitor empagliflozin in patients hospitalized for acute heart failure (EMPULSE): a multinational randomized trial. Nat Med. 2022;28(3):568\u2013574.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC8938265"}
      ] },
    { tag:"limitation", label:"Real-world uptake still lags guideline recommendation, especially in non-diabetic patients",
      detail:"Despite Class I/A status, SGLT2i prescribing has lagged. In a real-world HF registry, only 57.9% of patients overall received an SGLT2i \u2014 a clear gap against a Class I/A recommendation. Diabetes mellitus was among the strongest independent predictors of use (adjusted OR 2.29, 95% CI 1.60\u20133.29), meaning non-diabetic patients were correspondingly less likely to be treated, even though benefit is independent of diabetes status. Cost, administrative/reimbursement hurdles, and historical framing as a \u2018diabetes drug\u2019 are cited contributing factors. This diabetes-status gap is not uniform across every cohort studied; some series (particularly in older adults) have found no significant difference by diabetes status, so its size should be expected to vary by setting.",
      chart:{type:"badge", items:[{value:"57.9%", label:"of eligible HF patients received an SGLT2i in a real-world registry, despite Class I/A guideline status", color:"limitation"}]},
      citation:"Utilization Patterns and Barriers to Sodium-Glucose Cotransporter-2 Inhibitor Prescription in Patients with Heart Failure: Real-World Evidence from Saudi Arabia. Cardiol Ther. 2026.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC13542037/" },
    { tag:"practical", label:"Known, manageable safety profile",
      detail:"Genital mycotic infections and volume depletion are common but manageable. Euglycemic DKA, Fournier's gangrene, and lower-limb amputation are rare but serious — a class-level signal. Fixed-dose with no titration, and can be initiated even during HF hospitalization before discharge — operationally the simplest of the GDMT pillars to start.",
      chart:{type:"table", title:"Adverse event profile", columns:["Common (manageable)","Rare but serious (class-level)"],
        rows:[
          {label:"Events", values:["Genital mycotic infections<br>Volume depletion","Euglycemic DKA<br>Fournier's gangrene<br>Lower-limb amputation"]}
        ]} }
  ]

t2: {
  cat: "treatment", title: "MRA (Spironolactone) in HFpEF — Why/Why Not, Old vs New Evidence, ESC Guidelines",
  insight: "With the recent ESC guideline changes, would you now consider using an SGLT2i and an MRA together in all HFpEF patients? And how do you personally think about the differences between spironolactone, eplerenone, and finerenone?",
  bullets: [
    { tag:"practical", label:"Mechanism of action: blocking aldosterone's cardiac and renal effects",
      detail:"Aldosterone acts beyond its classic renal sodium-retention role \u2014 its receptors are also expressed in cardiomyocytes, vascular smooth muscle, and endothelial cells, where chronic activation drives inflammation, oxidative stress, cardiac fibrosis, and hypertrophy. Spironolactone and eplerenone competitively block this receptor, and in combination with ACE inhibitors/ARBs, achieve near-complete suppression of the renin\u2013angiotensin\u2013aldosterone system. This mechanism underpins their established benefit in HFrEF, shown in the landmark RALES (spironolactone) and EPHESUS/EMPHASIS-HF (eplerenone) trials.",
      chart:{type:"receptor-diagram", title:"Mineralocorticoid receptor: activation vs. blockade",
        panelA:{
          title:"A. Unopposed receptor activation",
          stimuli:["Aldosterone","Excess cortisol, oxidative stress, glucose"],
          receptor:"Mineralocorticoid receptor",
          renal:{title:"Renal effects", items:["Na\u207a and H\u2082O resorption","Volume overload","K\u207a and Mg\u00b2\u207a excretion","Glomerular injury"]},
          cv:{title:"Cardiovascular effects", items:["Endothelial dysfunction","Vasoconstriction","Inflammation and oxidative stress","Myocardial hypertrophy","Apoptosis and fibrosis"]}
        },
        panelB:{
          title:"B. MRA blockade",
          blockers:["Spironolactone","Eplerenone"],
          receptor:"Mineralocorticoid receptor",
          outcomeCols:[
            ["\u2193 Inflammation","\u2193 Fibrosis","\u2193 Adverse cardiac remodeling"],
            ["\u2191 Vasodilatation","\u2191 Cardiac output","\u2191 LV systolic/diastolic function"],
            ["\u2191 Natriuresis","\u2193 LV filling pressures","\u2193 Atrial/ventricular arrhythmia"]
          ]
        }},
      citation:"Mineralocorticoid Receptor Antagonists in Heart Failure. Cardiac Failure Review.", url:"https://www.cfrjournal.com/articles/evidence-aldosterone-antagonism-heart-failure?language_content_entity=en" },
    { tag:"evidence", label:"TOPCAT showed real benefit \u2014 but only in part of the trial population",
      detail:"Overall TOPCAT primary result was neutral (HR 0.89, 95% CI 0.77\u20131.04). In the Americas cohort specifically, spironolactone significantly reduced the primary outcome (HR 0.82, P=0.026), cardiovascular mortality (\u221226%), and HF hospitalization (\u221218%). Patients enrolled from Russia/Georgia showed no treatment effect at all.",
      chart:{type:"hr", title:"TOPCAT primary outcome HR (95% CI)", rows:[
        {label:"Overall trial", hr:0.89, lo:0.77, hi:1.04},
        {label:"Americas cohort", hr:0.82, lo:0.69, hi:0.98},
        {label:"Russia/Georgia", hr:1.10, lo:0.79, hi:1.51}
      ]},
      citation:"Pitt B, et al. Spironolactone for HFpEF. N Engl J Med. 2014;370:1383\u20131392. Pfeffer MA, et al. Regional Variation in TOPCAT. Circulation. 2015.", url:"https://www.ahajournals.org/doi/10.1161/circulationaha.114.013255" },
    { tag:"limitation", label:"The Russia/Georgia null result likely reflects trial conduct issues \u2014 but it still muddies the overall evidence base",
      detail:"Post-hoc analysis found many Russia/Georgia patients assigned to spironolactone lacked detectable canrenone (its active metabolite), suggesting non-adherence or misclassification, and this cohort's event rates were implausibly low for genuine HFpEF. This explains \u2014 but doesn't erase \u2014 why TOPCAT's headline result reads neutral rather than positive.",
      chart:{type:"hr", title:"TOPCAT primary outcome by region (HR, 95% CI)", rows:[
        {label:"Americas", hr:0.82, lo:0.69, hi:0.98},
        {label:"Russia / Georgia", hr:1.10, lo:0.79, hi:1.51}
      ]},
      citation:"Bristow MR, Enciso JS, Gersh BJ, et al. Detection and Management of Geographic Disparities in the TOPCAT Trial: Lessons Learned and Derivative Recommendations. JACC Basic Transl Sci. 2016;1(3):180\u2013189.", url:"https://pubmed.ncbi.nlm.nih.gov/27747305/" },
    { tag:"evidence", label:"Biomarker-guided benefit: elevated BNP identifies likely responders",
      detail:"In TOPCAT, patients randomized via the elevated-BNP entry route achieved significant benefit from spironolactone (P=0.003, P for interaction between strata = 0.01); those randomized via the prior-hospitalization route saw no effect \u2014 establishing biomarker-based patient selection as an evidence-based clinical strategy for this class.",
      chart:{type:"hr", title:"TOPCAT primary outcome by entry stratum (HR, 95% CI)", rows:[
        {label:"Elevated BNP stratum", hr:0.65, lo:0.49, hi:0.87},
        {label:"Hospitalization stratum", hr:1.01, lo:0.84, hi:1.21}
      ]},
      citation:"Pitt B, Pfeffer MA, Assmann SF, et al. Spironolactone for Heart Failure with Preserved Ejection Fraction. N Engl J Med. 2014;370:1383\u20131392.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa1313731" },
    { tag:"guideline", label:"2026 ESC Guidelines: MRA upgraded to Class I, Level A for HF independent of LVEF",
      detail:"The 2026 ESC Guidelines introduce a new framework: GDMT is now an umbrella term covering Foundational Medical Therapy (FMT) and Additional Medical Therapy (AMT). For HFpEF specifically, FMT now consists of SGLT2i and MRA \u2014 both Class I, Level A. This is a genuine upgrade for MRA from the 2023 update's Class IIb, Level C. The evidence basis differs by phenotype: HFrEF relies on steroidal-MRA-only RCTs, while the HFpEF rating rests specifically on a 2024 individual-patient-level meta-analysis pooling steroidal (TOPCAT) and non-steroidal (FINEARTS-HF) MRA trial data together.",
      chart:{type:"badge", items:[
        {value:"I / A", label:"SGLT2i \u2014 reconfirmed, unchanged", color:"evidence"},
        {value:"I / A", label:"MRA \u2014 upgraded from IIb/C (2023) to I/A (2026)", color:"evidence"}
      ]},
      citations:[
        {citation:"2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026.", url:"https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag100/8766302"},
        {citation:"Jhund PS, Talebi A, Henderson AD, et al. Mineralocorticoid receptor antagonists in heart failure: an individual patient level meta-analysis. Lancet. 2024;404:1119\u20131131.", url:"https://doi.org/10.1016/S0140-6736(24)01733-1"}
      ] },
    { tag:"limitation", label:"Real-world underuse, largely due to hyperkalemia/renal safety concerns",
      detail:"In the CHAMP-HF registry of outpatients with HFrEF, MRA was the least-prescribed of the guideline-directed therapy classes among eligible patients \u2014 well behind renin-angiotensin system inhibition and beta-blockers. Hyperkalemia and renal function concerns, especially relevant given CKD coexists in nearly half of HF patients, are cited as the leading reasons for under-prescription and early discontinuation. This registry is HFrEF-specific; equivalent HFpEF-focused prescribing-rate data is more limited. Australian data tells a similar story of underuse: in the SHAPE study, a real-world Australian general-practice HF cohort (not HFpEF-specific), only 16.0% of patients were prescribed spironolactone and just 1.2% eplerenone.",
      chart:[
        {type:"compare", title:"CHAMP-HF: % of eligible patients prescribed (HFrEF registry)", unit:"%", max:100,
          rows:[{label:"RAS inhibition (ACEi/ARB/ARNI)", value:73.4},{label:"Beta-blocker", value:67},{label:"MRA", value:33.4}]},
        {type:"table", title:"Why the caution: real-world hyperkalemia after RALES (Ontario, per 1,000 patients)", columns:["Before RALES (1994)","After RALES (2001)"],
          rows:[
            {label:"Spironolactone prescriptions", values:["34","149"]},
            {label:"Hyperkalemia hospitalization", values:["2.4","11.0"]},
            {label:"Hyperkalemia-associated death", values:["0.3","2.0"]}
          ]},
        {type:"badge", items:[
          {value:"16.0%", label:"Spironolactone prescribed, Australian general-practice HF cohort (SHAPE study)", color:"limitation"},
          {value:"1.2%", label:"Eplerenone prescribed, same Australian cohort", color:"limitation"}
        ]}
      ],
      citations:[
        {citation:"Greene SJ, Butler J, Albert NM, et al. Medical Therapy for Heart Failure with Reduced Ejection Fraction: The CHAMP-HF Registry. J Am Coll Cardiol. 2018;72(4):351\u2013366.", url:"https://www.jacc.org/doi/10.1016/j.jacc.2018.04.070"},
        {citation:"Juurlink DN, Mamdani MM, Lee DS, et al. Rates of Hyperkalemia after Publication of the Randomized Aldactone Evaluation Study. N Engl J Med. 2004;351:543\u2013551.", url:"https://www.nejm.org/doi/full/10.1056/NEJMoa040135"},
        {citation:"Sindone AP, Haikerwal D, Audehm RG, et al. Clinical characteristics of people with heart failure in Australian general practice: results from a retrospective cohort study. ESC Heart Fail. 2021;8(6):4497\u20134505.", url:"https://onlinelibrary.wiley.com/doi/full/10.1002/ehf2.13661"}
      ] }
  ]
},

t3: {
  cat: "treatment", title: "Finerenone in HFpEF — Strength of Evidence, Limitations & Challenges",
  insight: "Where do you see the gap in MRA use in HFrEF today, and do you think that same gap could carry over into HFpEF as guidelines evolve?",
  bullets: [
    { tag:"practical", label:"Mechanism of action: nonsteroidal vs steroidal MR blockade",
      detail:"Finerenone is a nonsteroidal, bulky-structure MR antagonist — distinct from the flat, steroidal structure of spironolactone and eplerenone. This structural difference underlies its higher MR selectivity, shorter half-life, and lower rate of sex-hormone-related side effects (e.g., gynecomastia/breast pain) historically associated with spironolactone.",
      chart:{type:"table", title:"Pharmacodynamic & kinetic comparison", columns:["Spironolactone","Eplerenone","Finerenone"],
        rows:[
          {label:"Structural properties", values:["Flat (steroidal)","Flat (steroidal)","Bulky (non-steroidal)"]},
          {label:"MR affinity", values:["+++","+","+++"]},
          {label:"MR selectivity", values:["+","++","+++"]},
          {label:"Sex-hormone-related side effects", values:["++","(+)","–"]},
          {label:"CNS penetration", values:["+","+","–"]},
          {label:"Plasma half-life", values:[">20 h","4–6 h","2–3 h"]},
          {label:"Effect on BP", values:["+++","++","+"]}
        ]},
      citation:"Kintscher U, Edelmann F. The non-steroidal MRA finerenone and HFpEF. Cardiovasc Diabetol. 2023.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC10311906/" },
    { tag:"evidence", label:"FINEARTS-HF: first MRA of either class to show a positive primary outcome in this population",
      detail:"In 6,001 patients with LVEF \u226540% (median follow-up 32 months), finerenone reduced the composite of total worsening HF events plus CV death by 16% (rate ratio 0.84, 95% CI 0.74\u20130.95, P=0.007) \u2014 driven primarily by fewer HF hospitalization/urgent visit events (rate ratio 0.82, P=0.006).",
      chart:{type:"hr", title:"FINEARTS-HF outcomes (rate ratio / HR, 95% CI)", rows:[
        {label:"Primary composite", hr:0.84, lo:0.74, hi:0.95},
        {label:"Worsening HF events", hr:0.82, lo:0.71, hi:0.94},
        {label:"CV death alone", hr:0.93, lo:0.78, hi:1.11}
      ]},
      citation:"Solomon SD, McMurray JJV, et al. Finerenone in HF with Mildly Reduced or Preserved Ejection Fraction. N Engl J Med. 2024;391:1475\u20131485.", url:"https://www.nejm.org/doi/10.1056/NEJMoa2407107" },
    { tag:"evidence", label:"Consistent benefit across age, plus a notable metabolic signal",
      detail:"Benefit was consistent across all age quartiles from 40 to 97 years (P for interaction = 0.27). A secondary finding also showed a 24% relative reduction in new-onset diabetes (HR 0.76, 95% CI 0.59\u20130.97, P=0.026) \u2014 a notable ancillary signal given the metabolic overlap common in HFpEF.",
      chart:{type:"hr", title:"Primary outcome by age quartile (rate ratio, 95% CI)", rows:[

      detail:"LVEF is the real fork in the road for which tool to use. LIFE-HF was derived and validated specifically in LVEF \u226440% populations (PARADIGM-HF/ATMOSPHERE, validated in DAPA-HF); it shouldn't be applied to HFpEF. LIFE-Preserved is the mirror image \u2014 the only one of the four derived and externally validated specifically in HFpEF (LVEF \u226550%), including validation against the EMPEROR-Preserved trial itself. MAGGIC remains a reasonable cross-check in HFpEF since it's been separately re-validated there, though its output is mortality-only \u2014 narrower than LIFE-Preserved's HF-hospitalization-plus-CV-death composite. Seattle Heart Failure Model is the least suited of the four to HFpEF: it was derived in PRAISE-1, an HFrEF trial population, and its standout feature \u2014 modeling benefit from beta-blockers, ICDs, and CRT \u2014 reflects the HFrEF treatment landscape, not HFpEF's actual therapies. LIFE-Preserved uses 14 routinely available predictors in sex-specific models, estimates both short-term and lifetime risk, and \u2014 genuinely useful for an MSL conversation \u2014 can estimate individualized treatment benefit from starting an SGLT2i.",

  bullets: [
    { tag:"practical", label:"A different point of attack: blocking aldosterone production, not just its receptor",
      detail:"Aldosterone synthase inhibitors (ASIs) work upstream of MRA \u2014 blocking CYP11B2, the enzyme that produces aldosterone, rather than blocking the receptor after aldosterone is already made. The rationale: MRA can trigger a compensatory rise in circulating aldosterone (\"aldosterone escape\") since the hormone itself isn't reduced, only its receptor binding; ASI addresses the source instead. The main class-level theoretical concern is off-target inhibition of cortisol synthesis, since the aldosterone- and cortisol-producing enzymes are structurally similar \u2014 trial data on vicadrostat so far show high selectivity for the aldosterone-producing enzyme with no meaningful cortisol changes observed. This mechanism is investigational, not an established treatment option; the goal here is understanding, ahead of Phase III HF outcomes data.",
      chart:{type:"intercept-pathway", title:"Two different points of attack on the same pathway"},
      citation:"EASi-HF Preserved (NCT06424288): A Study to Test Whether Vicadrostat in Combination With Empagliflozin Helps People With Heart Failure. ClinicalTrials.gov. Boehringer Ingelheim.", url:"https://clinicaltrials.gov/study/NCT06424288" },
    { tag:"evidence", label:"The broader ASI class: mixed early signals, then a positive Phase III confirmation \u2014 in hypertension, not yet HF",
      detail:"Vicadrostat is Boehringer Ingelheim's own ASI, but it isn't the only molecule in this class \u2014 baxdrostat (AstraZeneca) has the most mature human data, all in hypertension, not heart failure. Its Phase 2 BrigHTN trial (resistant hypertension) showed a significant placebo-corrected systolic BP reduction of \u221211.0 mmHg at the 2 mg dose, stopped early for overwhelming efficacy, with no adrenocortical insufficiency observed. Its other Phase 2 trial, HALO (uncontrolled hypertension), missed its primary endpoint \u2014 investigators attributed this to an unusually large blood-pressure improvement in the placebo group, linked to better medication adherence during the trial rather than a true lack of drug effect. The definitive Phase III BaxHTN trial (2025) subsequently met its primary and secondary endpoints for both resistant and uncontrolled hypertension. None of this is heart failure data \u2014 it establishes the mechanism works to lower blood pressure and aldosterone in humans, not that it improves HF outcomes.",

</script>
<script>
const TAB_TOPICS = {
  screening: ["s0","s1","s2","s2b","s2c","s3"],
  treatment: ["t1","t2","t3"],
  residual: ["r0","r1","r2","r3","r4"],
  horizon: ["h1","h2"]
};
const TAB_LABELS = {screening:"Screening & Diagnosis", treatment:"Treatment", residual:"Residual Risk & Treatment Escalation", horizon:"On the Horizon"};
const TAG_LABEL = {evidence:"Evidence", limitation:"Limitation", guideline:"Guideline", practical:"Practical"};

let activeTab = "screening";
let activeTopic = "s1";
let activeBulletIdx = 0;

function buildChart(chart){
  if(!chart) return "";
  if(chart.type === "compare"){
    let rows = chart.rows.map(r=>{
      const pct = Math.min(100, (r.value / chart.max) * 100);
      return `<div class="chart-compare-row">
        <div class="chart-compare-label">${r.label}</div>
        <div class="chart-compare-track"><div class="chart-compare-fill" style="width:${pct}%; background:var(--brand);"><span>${r.range || (r.value + (chart.unit==='AUC' ? '' : ' '+chart.unit))}</span></div></div>
      </div>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''}</div><div class="chart-compare">${rows}</div></div>`;
  }
  if(chart.type === "badge"){
    let items = chart.items.map(it=>{
      const colorVar = {evidence:'var(--evidence)', limitation:'var(--limitation)', guideline:'var(--guideline)'}[it.color] || 'var(--muted)';
      const bgVar = it.color==='evidence' ? 'rgba(15,163,107,0.1)' : it.color==='limitation' ? 'rgba(216,72,76,0.1)' : it.color==='guideline' ? 'rgba(59,111,212,0.1)' : 'rgba(92,114,105,0.08)';
      return `<div class="chart-badge" style="background:${bgVar}; border:1.5px solid ${colorVar};">
        <div class="bclass" style="color:${colorVar};">${it.value}</div>
        <div class="blabel" style="color:var(--ink);">${it.label}</div>
      </div>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-badge-row">${items}</div></div>`;
  }
  if(chart.type === "hr"){
    let allVals = [];
    chart.rows.forEach(r=>{ allVals.push(r.lo, r.hi, r.hr); });
    const minV = Math.min(0.5, ...allVals) - 0.05;
    const maxV = Math.max(1.2, ...allVals) + 0.05;
    const scale = v => ((v - minV) / (maxV - minV)) * 100;
    const nullPos = scale(1.0);
    let rows = chart.rows.map(r=>{
      const loPos = scale(r.lo), hiPos = scale(r.hi), ptPos = scale(r.hr);
      return `<div class="chart-hr-row">
        <div class="chart-hr-label">${r.label}</div>
        <div class="chart-hr-line">
          <div class="chart-hr-axis"></div>
          <div class="chart-hr-null" style="left:${nullPos}%;"></div>
          <div class="chart-hr-ci" style="left:${loPos}%; width:${hiPos-loPos}%;"></div>
          <div class="chart-hr-point" style="left:${ptPos}%;"></div>
        </div>
        <div class="chart-hr-value">${chart.statLabel || 'HR'} ${r.hr.toFixed(2)} (${r.lo.toFixed(2)}\u2013${r.hi.toFixed(2)})</div>
      </div>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''} \u00b7 dashed line = no effect (${chart.statLabel || 'HR'} 1.0)</div><div class="chart-hr">${rows}</div></div>`;
  }
  if(chart.type === "pathway"){
    const boxes = chart.items.map(it=>
      `<div style="flex:1; background:${it.bg}; border:1.5px solid ${it.border}; border-radius:12px; padding:14px 12px; text-align:center;">
        <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:13.5px; color:${it.color}; margin-bottom:5px;">${it.title}</div>
        <div style="font-size:11px; color:var(--ink); line-height:1.5;">${it.subtitle}</div>
      </div>`
    ).join(`<div style="display:flex; align-items:center; padding:0 8px; color:var(--muted); font-size:11px; font-weight:700; flex-direction:column; text-align:center;">${chart.connector||'\u2260'}</div>`);
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''}</div><div style="display:flex; align-items:stretch;">${boxes}</div>${chart.footnote ? `<div class="calc-disclaimer" style="margin-top:12px;">${chart.footnote}</div>` : ''}</div>`;
  }
  if(chart.type === "table"){
    const headerCells = chart.columns.map(col=>`<th style="text-align:center; padding:9px 10px; font-size:11px; font-weight:700; color:var(--dark); border-bottom:2px solid var(--line);">${col}</th>`).join("");
    const bodyRows = chart.rows.map(r=>{
      const valCells = r.values.map(v=>`<td style="text-align:center; padding:9px 10px; font-size:11.5px; color:var(--ink); border-bottom:1px solid var(--line);">${v}</td>`).join("");
      return `<tr><td style="padding:9px 10px; font-size:11.5px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--line);">${r.label}</td>${valCells}</tr>`;
    }).join("");
    return `<div class="bullet-chart"><div class="chart-title">${chart.title||''}</div><table style="width:100%; border-collapse:collapse;"><tr><th style="padding:9px 10px; border-bottom:2px solid var(--line);"></th>${headerCells}</tr>${bodyRows}</table></div>`;
  }
  if(chart.type === "receptor-diagram"){
    const a = chart.panelA, b = chart.panelB;
    const stimuliA = a.stimuli.map(s=>`<div class="rd-stimulus">${s}</div>`).join("");
    const renalItems = a.renal.items.map(i=>`<li>${i}</li>`).join("");
    const cvItems = a.cv.items.map(i=>`<li>${i}</li>`).join("");
    const blockersB = b.blockers.map(s=>`<div class="rd-blocker">${s}</div>`).join("");
    const outcomeCols = b.outcomeCols.map(col=>`<div class="rd-col"><ul>${col.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("");
    return `<div class="bullet-chart">
      <div class="chart-title">${chart.title||''}</div>
      <div class="rd-wrap">
        <div class="rd-panel">
          <div class="rd-panel-title">${a.title}</div>
          <div class="rd-stimuli-row">${stimuliA}</div>
          <div class="rd-connector">\u2193</div>
          <div class="rd-receptor">${a.receptor}</div>
          <div class="rd-outcomes-row">
            <div class="rd-outcome-box"><div class="rd-outcome-title">${a.renal.title}</div><ul>${renalItems}</ul></div>
            <div class="rd-outcome-box"><div class="rd-outcome-title">${a.cv.title}</div><ul>${cvItems}</ul></div>
          </div>
        </div>
        <div class="rd-panel">
          <div class="rd-panel-title">${b.title}</div>
          <div class="rd-stimuli-row">${blockersB}</div>
          <div class="rd-connector">\u22a3</div>
          <div class="rd-receptor">${b.receptor}</div>
          <div class="rd-connector">\u2193</div>
          <div class="rd-outcomes-single"><div class="rd-cols">${outcomeCols}</div></div>
        </div>
      </div>
    </div>`;
  }
